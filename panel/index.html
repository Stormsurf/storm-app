<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Storm</title>
<meta name="theme-color" content="#EFECE8">
<link rel="manifest" href="/panel/manifest.webmanifest">
<link rel="icon" href="/icons/storm-app-192.png">
<link rel="apple-touch-icon" href="/icons/storm-app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Storm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=1">
</head>
<body>
<header class="ap-top"><a href="https://www.stormsurf.cl" aria-label="Storm"><img src="/img/storm-logo.png" alt="Storm" width="96" height="52"></a></header>
<main>
<style>
.pn{--aa:#61A1C8;--aa-dk:#2d6e94;--aa-soft:#E6F1F8;--ink:#2C2C2B;--line:rgba(44,44,43,.09);--ok:#3f8f5f;--ok-soft:#e5f2ea;--warn:#b5662b;--warn-soft:#fbeee2;max-width:720px;margin:0 auto;color:var(--ink)}
.pn *{box-sizing:border-box}
.pn-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pn-head img{width:120px;height:auto;display:block}
.pn-head h1{margin:0;font-family:var(--font-heading-family);font-weight:500;font-size:2.6rem;line-height:1.1}
.pn-head p{margin:2px 0 0;font-size:1.35rem;opacity:.65}
.pn-link{background:none;border:0;padding:0;font:inherit;font-size:1.35rem;color:var(--aa-dk);text-decoration:underline;cursor:pointer}
.pn-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pn-stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pn-stat small{display:block;font-size:1.2rem;opacity:.65;line-height:1.3}
.pn-stat b{display:block;font-size:2.4rem;font-weight:600;margin-top:4px;line-height:1.1}
.pn-stat em{display:block;font-style:normal;font-size:1.15rem;opacity:.6;margin-top:3px}
.pn-stat--main{grid-column:1/-1;background:var(--aa);color:#fff;border-color:transparent}
.pn-stat--main small,.pn-stat--main em{opacity:.9}
.pn-stat--main b{font-size:3rem}
.pn-stat--warn b{color:var(--warn)}
.pn-msgs{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pn-tabs{position:relative;display:flex;gap:4px;margin:18px -4px 0;padding:6px 4px;background:inherit}
.pn-tab{flex:1;border:0;border-radius:999px;padding:10px 6px;font:inherit;font-size:1.4rem;font-weight:600;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer}
.pn-tabs{overflow-x:auto;scrollbar-width:none}.pn-tabs::-webkit-scrollbar{display:none}
.pn-tab{flex:1 0 auto;padding-left:12px;padding-right:12px}
.pn-nt{border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-size:1.2rem;font-weight:600;padding:5px 12px;margin:6px 6px 0 0;cursor:pointer;color:inherit}
.pn-nt i{font-style:normal;display:inline-block;min-width:18px;margin-left:4px;border-radius:999px;background:#2C2C2B;color:#fff;font-size:1.05rem;line-height:18px;text-align:center}
.pn-ntbox{flex-basis:100%;background:#F3F1EC;border-radius:14px;padding:12px;margin-top:6px}
.pn-ntbox .pn-n{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:1.35rem;line-height:1.45;white-space:pre-line}
.pn-ntbox .pn-n small{display:block;font-size:1.15rem;opacity:.6;margin-bottom:2px}
.pn-ntbox textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:1.4rem;resize:vertical}
.pn-ntbox .pn-ntgo{border:0;border-radius:999px;background:#2C2C2B;color:#fff;font:inherit;font-weight:600;font-size:1.3rem;padding:8px 16px;margin-top:6px;cursor:pointer}
.pn-ntbox .pn-ntgo[disabled]{opacity:.5}
.pn-ntbox .pn-sub{margin:0 0 8px}
.pn-al{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.pn-al:last-child{border-bottom:0}
.pn-al b{font-size:1.5rem;font-weight:600}
.pn-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pn-tab i{font-style:normal;display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--warn);color:#fff;font-size:1.1rem;line-height:18px}
.pn-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.pn-card h3{margin:0;font-size:1.7rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pn-when{display:inline-block;font-size:1.15rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--aa-dk);margin-bottom:4px}
.pn-sub{margin:2px 0 0;font-size:1.35rem;opacity:.7}
.pn-count{flex:none;font-size:1.3rem;font-weight:600;background:var(--aa-soft);color:var(--aa-dk);padding:4px 10px;border-radius:999px}
.pn-bar{height:6px;border-radius:6px;background:var(--aa-soft);margin:12px 0 4px;overflow:hidden}
.pn-bar span{display:block;height:100%;background:var(--aa);border-radius:6px}
.pn-grp{margin-top:12px}
.pn-grp>small{display:block;font-size:1.15rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.5;margin-bottom:6px}
.pn-sig{display:inline-block;border-radius:999px;padding:1px 8px;font-size:1.15rem;font-weight:600;background:#eee;color:#555;margin-right:4px}
.pn-sig--si{background:#DDF2E3;color:#1E6B3A}
.pn-sig--no{background:#FBE3DA;color:#9A3B1C}
.pn-sems{font-size:1.15rem;opacity:.7}
.pn-sems b{opacity:1;color:var(--ink)}
.pn-cargo{display:block;font-size:1.25rem;opacity:.75;margin:-3px 0 7px}
.pn-tu{display:inline-block;background:var(--aa);color:#fff;border-radius:999px;padding:1px 8px;font-size:1.1rem;font-weight:700;margin-left:6px;vertical-align:1px}
.pn-verano .pn-tu{background:#FADF70;color:#3B2610}
.pn-chips{display:flex;flex-wrap:wrap;gap:6px}
.pn-chip{font-size:1.35rem;padding:5px 11px;border-radius:999px;background:#f4f1ec}
.pn-chip--in{background:var(--ok-soft);color:var(--ok)}
.pn-cancel{opacity:.55}
.pn-cancel h3{text-decoration:line-through}
.pn-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pn-row:last-child{border-bottom:0}
.pn-row b{display:block;font-size:1.5rem;font-weight:600}
.pn-row small{display:block;font-size:1.25rem;opacity:.65;margin-top:2px}
.pn-amt{flex:none;font-weight:600;font-size:1.45rem}
.pn-acts{display:flex;gap:6px;align-items:center;flex:none}
.pn-paid{border:1.5px solid var(--ok);background:#fff;color:var(--ok);border-radius:999px;padding:7px 12px;font:inherit;font-weight:600;font-size:1.3rem;cursor:pointer}
.pn-paid[disabled]{opacity:.5}
@media (max-width:420px){.pn-row--wrap{flex-wrap:wrap}.pn-row--wrap .pn-acts{width:100%;justify-content:flex-end}}
.pn-wa{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#25D366;color:#fff;text-decoration:none;font-weight:600;font-size:1.3rem;padding:8px 14px}
.pn-dur{display:inline-block;font-size:1.1rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#EDEBE6;color:#2C2C2B;margin-right:2px;vertical-align:middle}
.pn-dur--mes{background:#FFDE59}
.pn-tag{display:inline-block;font-size:1.1rem;padding:2px 8px;border-radius:999px;background:var(--aa-soft);color:var(--aa-dk);margin-left:4px;vertical-align:middle;font-weight:600}
.pn-tag--warn{background:var(--warn-soft);color:var(--warn)}
.pn-empty{font-size:1.4rem;opacity:.65;margin:10px 0 0}
.pn-note{font-size:1.25rem;opacity:.6;margin:14px 0 0;line-height:1.5;text-align:center}
.pn-go{display:inline-block;border:0;border-radius:999px;background:var(--aa);color:#fff;text-decoration:none;font:inherit;font-weight:600;font-size:1.5rem;padding:14px 26px;cursor:pointer;text-align:center}
.pn-go[disabled]{opacity:.6}
.pn-login{text-align:center;max-width:420px;margin:24px auto 0}
.pn-login p{margin:0 auto 14px;font-size:1.5rem;line-height:1.5}
.pn-in{display:block;width:100%;margin:0 auto 12px;border:1.5px solid rgba(44,44,43,.18);border-radius:12px;padding:13px 14px;font:inherit;font-size:1.6rem;text-align:center;background:#fff;color:var(--ink)}
.pn-in:focus{outline:none;border-color:var(--aa)}
.pn-in--code{letter-spacing:.4em;font-size:2.2rem;font-weight:600}
.pn-login .pn-go{width:100%}
.pn-msg{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:1.4rem;background:#f6e3df;text-align:left}
.pn-skel{height:110px;border-radius:16px;margin-top:12px;background:linear-gradient(90deg,#fff 0%,#f3f1ee 50%,#fff 100%);background-size:200% 100%;animation:pnsk 1.2s infinite linear}
@keyframes pnsk{to{background-position:-200% 0}}
.pn-pane[hidden]{display:none}
.pn-days{display:flex;gap:6px;overflow-x:auto;margin:14px -4px 0;padding:2px 4px 4px;scrollbar-width:none}
.pn-day{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font:inherit;font-size:1.25rem;text-align:left;cursor:pointer;color:var(--ink)}
.pn-day b{display:block;font-size:1.35rem}
.pn-day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pn-day i{font-style:normal;color:var(--ok)}
.pn-day.on i{color:#9fe0b6}
.pn-kid{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pn-kid:last-child{border-bottom:0}
.pn-tick{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer;color:var(--ink);min-height:40px}
.pn-tick span{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid rgba(44,44,43,.2);display:grid;place-items:center;font-size:1.6rem;color:#fff;transition:.15s}
.pn-tick.si span{background:var(--ok);border-color:var(--ok)}
.pn-tick.no span{border-color:var(--warn);color:var(--warn)}
.pn-tick b{font-size:1.5rem;font-weight:600}
.pn-tick small{display:block;font-size:1.15rem;opacity:.6}
.pn-save{width:100%;margin-top:14px}
.pn-ok{background:var(--ok-soft);color:var(--ok);padding:10px 14px;border-radius:12px;font-size:1.35rem;margin-top:12px}
.pn-stars{font-size:1.6rem;letter-spacing:2px;color:#e0a526}
@media (max-width:420px){.pn-tab{font-size:1.25rem;padding:9px 4px}}
@media (min-width:640px){.pn-stats{grid-template-columns:2fr 1fr 1fr}.pn-stat--main{grid-column:auto}}
.pn-gsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pn-gbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:inherit;font-size:1.35rem;cursor:pointer;color:var(--ink)}
.pn-gbtn small{opacity:.55;margin-left:3px}
.pn-gbtn.on{background:var(--aa);border-color:var(--aa);color:#fff}
.pn-gbtn.on small{opacity:.85}
.pn-ta{display:block;width:100%;min-height:120px;margin-top:12px;border:1.5px solid rgba(44,44,43,.18);border-radius:12px;padding:12px 14px;font:inherit;font-size:1.5rem;line-height:1.45;background:#fff;color:var(--ink);resize:vertical}
.pn-ta:focus{outline:none;border-color:var(--aa)}
.pn-chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:1.35rem}
.pn-chk input{width:18px;height:18px;accent-color:var(--aa)}
.pn-stat--sun{background:#FADF70;color:#3B2610;border-color:transparent}
.pn-stat--sun small,.pn-stat--sun em{opacity:.8}
.pn-stat--sun b{font-size:3rem}
.pn-day small{display:block;font-size:1.1rem;opacity:.65}
.pn-vk{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.pn-vk:last-child{border-bottom:0}
.pn-vk{flex-wrap:wrap}.pn-vk>div:first-child{flex:1 1 0;min-width:0}
.pn-nv{border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-size:1.2rem;font-weight:600;padding:5px 12px;margin-top:6px;cursor:pointer;color:inherit}
.pn-nvbox{flex-basis:100%;background:#FFF7D6;border-radius:14px;padding:12px;margin-top:4px}
.pn-nvbox p{margin:0 0 8px;font-size:1.3rem}
.pn-nvops{display:flex;flex-wrap:wrap;gap:6px}
.pn-nvops button{border:1px solid rgba(44,44,43,.18);background:#fff;border-radius:999px;font:inherit;font-size:1.3rem;padding:7px 12px;cursor:pointer;color:inherit}
.pn-nvops button.on{background:#2C2C2B;color:#fff;border-color:#2C2C2B}
.pn-nvops button.act{opacity:.45;cursor:default}
.pn-nvbox label{display:flex;gap:8px;align-items:center;font-size:1.3rem;margin:10px 0}
.pn-nvbox .pn-nvgo{border:0;border-radius:999px;background:#2C2C2B;color:#fff;font:inherit;font-weight:600;font-size:1.35rem;padding:9px 18px;cursor:pointer}
.pn-nvbox .pn-nvgo[disabled]{opacity:.5}
.pn-nvbox .pn-link{margin-left:10px}
.pn-ok{background:#E7F4EE;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:1.4rem}
.pn-vk b{font-size:1.5rem;font-weight:600}
.pn-vk small{display:block;font-size:1.2rem;opacity:.65;margin-top:2px}
.pn-sw{display:flex;gap:4px;margin-top:14px;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.pn-sw button{flex:1;border:0;border-radius:999px;padding:10px 8px;font:inherit;font-size:1.4rem;font-weight:600;background:none;color:var(--ink);cursor:pointer}
.pn-sw button.on{background:var(--aa);color:#fff}
.pn-sw button[data-acad='verano'].on{background:#FADF70;color:#3B2610}
.pn-sw button[data-acad='finanzas'].on{background:var(--ink);color:#fff}
.pn-finz[hidden],.pn-fpane[hidden]{display:none}
.pn-fsub{display:flex;gap:6px;margin-top:14px}
.pn-fsub button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:1.35rem;font-weight:600;cursor:pointer;color:var(--ink)}
.pn-fsub button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pn-verano[hidden]{display:none}
.pn-verano .pn-gbtn.on{background:#FADF70;border-color:#FADF70;color:#3B2610}
.pn-verano .pn-day.on{background:#3B2610;border-color:#3B2610}
.pn-salud{display:block;margin-top:4px;font-size:1.25rem;color:var(--warn)}
.pn-sent p{margin:4px 0 0;font-size:1.4rem;line-height:1.45;white-space:pre-line}
.pn-gm{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pn-gp h3 .pn-gsal{font-size:1.7rem;color:var(--warn);text-align:right;line-height:1.1}
.pn-gp h3 .pn-gsal small{display:block;font-size:1.1rem;font-weight:500;opacity:.75}
.pn-gok{font-size:1.3rem;color:var(--ok);background:var(--ok-soft);padding:4px 10px;border-radius:999px}
.pn-gcl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pn-gc{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:1.25rem;font-weight:600;cursor:pointer;line-height:1.15;text-align:center}
.pn-gc small{display:block;font-size:1.05rem;font-weight:500;opacity:.65}
.pn-gc.no{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);text-decoration:line-through}
.pn-gc.no small{text-decoration:none}
.pn-gc.ask{background:var(--ink);border-color:var(--ink);color:#fff;text-decoration:none}
.pn-hint{font-size:1.15rem;opacity:.55;margin:6px 0 0}
.pn-gmov{margin-top:10px;border-top:1px solid var(--line)}
.pn-gmov div{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:1.3rem}
.pn-gmov span{flex:1;opacity:.8}
.pn-gmov button{border:0;background:none;font:inherit;font-size:1.5rem;opacity:.45;cursor:pointer;padding:0 4px}
.pn-gmov button.ask{font-size:1.15rem;opacity:1;color:var(--warn);font-weight:600}
.pn-gbox{background:#F3F1EC;border-radius:14px;padding:12px;margin-top:10px}
.pn-gbox p{margin:0 0 8px;font-size:1.4rem}
.pn-gbox input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:1.5rem;margin-top:6px;background:#fff}
.pn-gpre{display:flex;flex-wrap:wrap;gap:6px}
.pn-gpre button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:1.3rem;font-weight:600;cursor:pointer}
.pn-gbox .pn-acts{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:8px}
.pn-gbox .pn-ntgo{border:0;border-radius:999px;background:#2C2C2B;color:#fff;font:inherit;font-weight:600;font-size:1.3rem;padding:8px 16px;cursor:pointer}
.pn-fadd input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:1.5rem;margin-top:8px;background:#fff}
.pn-fadd .pn-gm{margin-top:10px}
.pn-fadd .pn-acts{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:12px}
.pn-fadd .pn-ntgo{border:0;border-radius:999px;background:#2C2C2B;color:#fff;font:inherit;font-weight:600;font-size:1.4rem;padding:10px 20px;cursor:pointer}
#pn-fmsg{color:var(--ok);font-weight:600;font-size:1.3rem}
.pn-fsw{display:flex;gap:4px;margin-top:10px;padding:4px;border-radius:999px;background:#F3F1EC}
.pn-fsw button{flex:1;border:0;border-radius:999px;padding:8px;font:inherit;font-weight:600;font-size:1.35rem;background:none;cursor:pointer;color:var(--ink)}
.pn-fsw button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pn-stat--main.pn-fneg{background:var(--warn)}
.pn-farea{padding:10px 0;border-bottom:1px solid var(--line)}.pn-farea:last-child{border-bottom:0}
.pn-fah{display:flex;justify-content:space-between;font-size:1.45rem}.pn-fah b{font-weight:600}.pn-fah span{font-weight:600;color:var(--ok)}.pn-fah span.neg{color:var(--warn)}
.pn-fbar{height:7px;border-radius:99px;background:#F3F1EC;margin-top:5px;overflow:hidden}.pn-fbar i{display:block;height:100%;border-radius:99px}
.pn-fbar i.in{background:var(--ok)}.pn-fbar i.out{background:var(--warn)}
.pn-farea small{display:block;font-size:1.15rem;opacity:.6;margin-top:4px}
.pn-gmov b.pn-fin{color:var(--ok)}
.pn-fij{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pn-fij:last-of-type{border-bottom:0}
.pn-fij i{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);font-style:normal;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.pn-fij.on i{background:var(--ok);border-color:var(--ok)}
.pn-fij span{flex:1}.pn-fij b{display:block;font-size:1.45rem;font-weight:600}.pn-fij small{display:block;font-size:1.2rem;opacity:.6}
.pn-fij.on small{color:var(--ok);opacity:1}
.pn-fij em{font-style:normal;font-weight:600;font-size:1.4rem}
.pn-fij.on b,.pn-fij.on em{opacity:.55}
.pn-vfin{display:block;width:100%;margin-top:12px;border:1.5px dashed #c9a93a;background:#FFF9E0;color:#3B2610;border-radius:14px;padding:12px;font:inherit;font-weight:600;font-size:1.4rem;cursor:pointer}
</style>
<section class='storm-section color-scheme-1 gradient'>
  <div class='storm-wrap pn'><div id='pn-app'><div class='pn-skel'></div><div class='pn-skel'></div></div></div>
</section>
<script>
(()=>{
  const API = "https://script.google.com/macros/s/AKfycbyFZiJBhEoWR3-mekjXfea3O0BbDItazLHQRUkCpWOUZOwJ4612kgiGsg4ocWpGBgO3/exec";
  // Academia de Verano: URL /exec del programa de la planilla de Verano (vacío = no se muestra la pestaña).
  const API_VERANO = "https://script.google.com/macros/s/AKfycbzSHDu8whWWNwq-EFwaWqwKOtyU5pnyPuixutUI8sd5twFaTjDibN11TA3bMH_UddTo/exec";
  const LOGO = "/img/academia-anual-logo.png";
  const KEY = 'storm-panel';
  const app = document.getElementById('pn-app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
  const clp = n => '$' + Math.round(n || 0).toLocaleString('es-CL');
  const guardar = s => { try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_){} };
  const leer = () => { try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(_){ return null; } };
  const borrar = () => { try{ localStorage.removeItem(KEY); }catch(_){} };
  const wa = t => { let n = String(t || '').replace(/\D/g, ''); if(n.length === 9 && n[0] === '9') n = '56' + n; if(n.length === 8) n = '569' + n; return n.length >= 10 ? n : ''; };
  const dm = f => { const m = String(f||'').match(/(\d{4})-(\d{2})-(\d{2})/) || String(f||'').match(/(\d{2})-(\d{2})-(\d{4})/); if(!m) return f; return m[1].length===4 ? 'pagó el ' + (+m[3]) + '/' + (+m[2]) : 'pagó el ' + (+m[1]) + '/' + (+m[2]); };
  const q0 = new URLSearchParams(location.search);
  let auth = (q0.get('e') && q0.get('ts') && q0.get('f')) ? {email:q0.get('e'), ts:q0.get('ts'), firma:q0.get('f')} : leer(), tab = 'clases';
  if(q0.get('e')){ guardar(auth); history.replaceState(null, '', location.pathname); }
  try{ tab = sessionStorage.getItem(KEY + '-tab') || 'clases'; }catch(_){}

  async function post(body){
    if(!API) throw new Error('El panel aún no está conectado.');
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || 'Error');
    return d;
  }

  function login(email, err, paso){
    app.innerHTML = `<div class='pn-login'>
      <img src='${esc(LOGO)}' alt='Storm' style='width:200px;height:auto;display:block;margin:0 auto 10px'>
      <h1 style='margin:0 0 14px;font-family:var(--font-heading-family);font-weight:500;font-size:2.6rem'>Panel Storm</h1>
      ${paso==='codigo'
        ? `<p>Te enviamos un código a <b>${esc(email)}</b>.</p>
           <input class='pn-in pn-in--code' id='pn-code' inputmode='numeric' autocomplete='one-time-code' maxlength='6' placeholder='······'>
           <button class='pn-go' id='pn-ok'>Entrar</button>
           <p class='pn-note'><button class='pn-link' id='pn-back'>Usar otro correo</button></p>`
        : `<p>Solo para el equipo Storm. Entra con tu correo y te mandamos un código.</p>
           <input class='pn-in' id='pn-email' type='email' autocomplete='email' placeholder='tu@correo.cl' value='${esc(email||'')}'>
           <button class='pn-go' id='pn-ok'>Recibir código</button>`}
      ${err ? `<div class='pn-msg'>${esc(err)}</div>` : ''}
    </div>`;
    const ok = document.getElementById('pn-ok');
    const input = document.getElementById(paso==='codigo' ? 'pn-code' : 'pn-email');
    input.focus();
    input.addEventListener('keydown', e => { if(e.key==='Enter') ok.click(); });
    if(paso==='codigo'){
      document.getElementById('pn-back').onclick = () => login(email);
      input.addEventListener('input', () => { input.value = input.value.replace(/\D/g,''); if(input.value.length===6) ok.click(); });
      ok.onclick = async () => {
        ok.disabled = true; ok.textContent = 'Entrando…';
        try{ const s = await post({accion:'entrar', email, codigo:input.value}); auth = {email:s.email, ts:s.ts, firma:s.firma}; guardar(auth); load(); }
        catch(x){ login(email, x.message, 'codigo'); }
      };
    } else {
      ok.onclick = async () => {
        const e = input.value.trim().toLowerCase();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return login(e, 'Revisa el correo.');
        ok.disabled = true; ok.textContent = 'Enviando…';
        try{ await post({accion:'pedir-codigo', email:e}); login(e, '', 'codigo'); }
        catch(x){ login(e, x.message); }
      };
    }
  }

  function mensajeGrupo(c){
    const cuando = c.cuando === 'Hoy' ? 'hoy ' : c.cuando === 'Mañana' ? 'mañana ' : 'el ';
    const dia = (c.texto || '').replace(/^./, x => x.toLowerCase());
    const tipo = /skate/i.test(c.clase) ? 'surfskate' : 'surf';
    if(c.cancelada) return `¡Hola familias Storm! 🌊 Les avisamos que la clase de ${tipo} de ${cuando}${dia} se suspende${c.nota ? ' (' + c.nota + ')' : ''}. ¡Gracias por su comprensión!`;
    return `¡Hola familias Storm! 🌊 Les recordamos que ${cuando}${dia} hay clase de ${tipo} de ${String(c.horario).replace(/\s*hrs?\.?$/i,'')} hrs. ¡Nos vemos en el agua! 🏄`;
  }
  function msgBtns(c, i){
    const t = mensajeGrupo(c);
    return `<div class='pn-msgs'><a class='pn-wa' target='_blank' rel='noopener' href='https://wa.me/?text=${encodeURIComponent(t)}'>Mensaje para el grupo</a><button class='pn-link' data-copy='${i}'>Copiar</button></div>`;
  }

  function claseCard(c){
    if(c.cancelada) return `<div class='pn-card pn-cancel'><span class='pn-when'>${esc(c.cuando)}</span><h3>${esc(c.clase)} · ${esc(c.horario)}<span class='pn-count'>Cancelada</span></h3><p class='pn-sub'>${esc(c.texto)}${c.nota?' · '+esc(c.nota):''}</p></div>`;
    const grupos = {};
    c.alumnos.forEach(a => (grupos[a.grupo || 'Sin grupo'] = grupos[a.grupo || 'Sin grupo'] || []).push(a));
    const pct = c.cupos ? Math.min(100, Math.round(c.van / c.cupos * 100)) : 0;
    return `<div class='pn-card'><span class='pn-when'>${esc(c.cuando)}</span>
      <h3>${esc(c.clase)} · ${esc(c.horario)}<span class='pn-count'>${c.van} de ${c.cupos}</span></h3>
      <p class='pn-sub'>${esc(c.texto)}${c.nota?' · '+esc(c.nota):''}</p>
      <div class='pn-bar'><span style='width:${pct}%'></span></div>
      ${c.alumnos.length ? Object.keys(grupos).sort(primeroMio()).map(g => `<div class='pn-grp'>${grpHead(g, grupos[g].length, ACARGO)}<div class='pn-chips'>${grupos[g].map(a => `<span class='pn-chip${a.movido?' pn-chip--in':''}'>${a.movido?'↪ ':''}${esc(a.nombre)}</span>`).join('')}</div></div>`).join('')
        : `<p class='pn-empty'>Todavía no hay alumnos en esta clase.</p>`}
      ${c.salen.length ? `<p class='pn-sub' style='margin-top:10px'>Se cambiaron a otro día: ${c.salen.map(esc).join(', ')}</p>` : ''}
    </div>`;
  }

  let CL = [];
  // Orden de los grupos en todo el Panel.
  const ORDEN = ['Kids','Iniciante','Progress','Intermedio','Avanzado','Federados'];
  const rango = g => { const t = String(g||'').toLowerCase().replace('principiante','iniciante'); const i = ORDEN.findIndex(x => x.toLowerCase() === t); return i < 0 ? 99 : i; };
  const porOrden = (a, b) => rango(a) - rango(b);
  // Quién está a cargo de cada grupo (pestaña Equipo) y cuál es el grupo de quien entra: va primero.
  let ACARGO = {}, MIOS = [];
  const mio = (g, mios) => (mios || MIOS).includes(g);
  const primeroMio = mios => (a, b) => (mio(b, mios) - mio(a, mios)) || porOrden(a, b);
  const grpHead = (g, n, cargo, mios) => `<small>${esc(g)} · ${n}${mio(g, mios) ? `<span class='pn-tu'>Tu grupo</span>` : ''}</small>${cargo && cargo[g] ? `<span class='pn-cargo'>A cargo: ${esc(cargo[g])}</span>` : ''}`;

  // ---------- Lista: asistencia ----------
  let LISTA = [], diaSel = 0, marcas = {};
  function listaPane(){
    if(!LISTA.length) return `<div class='pn-card'><p class='pn-empty'>No hay clases de los últimos días para pasar lista.</p></div>`;
    if(diaSel >= LISTA.length) diaSel = 0;
    const c = LISTA[diaSel];
    if(!marcas[c.fecha]) marcas[c.fecha] = {}; const m = marcas[c.fecha];
    c.alumnos.forEach(a => { if(!(a.nombre in m)) m[a.nombre] = a.vino; });
    const van = c.alumnos.filter(a => m[a.nombre]).length;
    return `<div class='pn-days'>${LISTA.map((x,i) => `<button class='pn-day${i===diaSel?' on':''}' data-dia='${i}'><b>${esc(x.cuando)}</b>${esc(x.clase)}${x.tomada?' <i>✓</i>':''}</button>`).join('')}</div>
      <div class='pn-card'><span class='pn-when'>${esc(c.cuando === c.texto ? c.clase : c.cuando)}</span>
        <h3>${esc(c.texto)}<span class='pn-count'>${van} de ${c.alumnos.length}</span></h3>
        <p class='pn-sub'>${esc(c.clase)} · ${esc(c.horario)} · Toca a los que vinieron.</p>
        ${c.alumnos.length ? c.alumnos.map((a,i) => `<div class='pn-kid'>
          <button class='pn-tick ${m[a.nombre]===true?'si':m[a.nombre]===false?'no':''}' data-kid='${i}'><span>${m[a.nombre]===true?'✓':m[a.nombre]===false?'–':''}</span><div><b>${esc(a.nombre)}</b><small>${esc(a.grupo||'Sin grupo')}</small></div></button></div>`).join('')
          : `<p class='pn-empty'>No había alumnos en esta clase.</p>`}
        ${c.alumnos.length ? `<button class='pn-go pn-save' id='pn-save'>${c.tomada ? 'Actualizar asistencia' : 'Guardar asistencia'}</button>` : ''}
        <div id='pn-lista-msg'></div>
      </div>
      <p class='pn-note'>Las familias ven la asistencia en Mi clase.</p>`;
  }
  function bindLista(){
    const pane = app.querySelector('[data-pane=lista]'); if(!pane) return;
    const redo = () => { pane.innerHTML = listaPane(); bindLista(); };
    pane.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => { diaSel = +b.dataset.dia; redo(); });
    const c = LISTA[diaSel]; if(!c) return;
    const m = marcas[c.fecha];
    pane.querySelectorAll('[data-kid]').forEach(b => b.onclick = () => { const n = c.alumnos[+b.dataset.kid].nombre; m[n] = m[n] === true ? false : true; redo(); });
    const sv = document.getElementById('pn-save');
    if(sv) sv.onclick = async () => {
      sv.disabled = true; sv.textContent = 'Guardando…';
      try{
        const d = await post(Object.assign({}, auth, {accion:'asistencia', fecha:c.fecha, lista:c.alumnos.map(a=>a.nombre), presentes:c.alumnos.filter(a=>m[a.nombre]).map(a=>a.nombre)}));
        LISTA = d.lista; delete marcas[c.fecha]; redo();
        document.getElementById('pn-lista-msg').innerHTML = `<div class='pn-ok'>Asistencia guardada ✓</div>`;
      }catch(x){ sv.disabled = false; sv.textContent = 'No se pudo, reintenta'; }
    };
  }
  function copiar(){ app.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const t = mensajeGrupo(CL[+b.dataset.copy]);
    try{ await navigator.clipboard.writeText(t); b.textContent = 'Copiado ✓'; }
    catch(_){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); b.textContent = 'Copiado ✓'; }
    setTimeout(() => b.textContent = 'Copiar', 2000);
  }); }
  // ---------- Mensajes por grupo (v17) ----------
  let gSel = [], borrador = '', diasSel = 0;
  function mensajesPane(d){
    const gs = (d.grupos || []).slice().sort((a,b) => porOrden(a.grupo, b.grupo)), total = gs.reduce((t,g)=>t+g.alumnos,0);
    return `<div class='pn-card'><h3>Mensaje para un grupo</h3>
      <p class='pn-sub'>Las familias lo ven arriba en Mi clase y también les llega por correo.</p>
      <div class='pn-gsel'>${gs.map(g=>`<button class='pn-gbtn${gSel.includes(g.grupo)?' on':''}' data-g='${esc(g.grupo)}'>${esc(g.grupo)}<small>${g.alumnos}</small></button>`).join('')}<button class='pn-gbtn${gSel.includes('Todos')?' on':''}' data-g='Todos'>Todos<small>${total}</small></button></div>
      <textarea class='pn-ta' maxlength='600' placeholder='Ej: Hola familias del grupo Avanzado. Mañana nos juntamos 15:45 en la escuela.' data-msg-t>${esc(borrador)}</textarea>
      <div class='pn-grp'><small>¿Hasta cuándo se ve en Mi clase?</small><div class='pn-gsel' style='margin-top:0'>${[[0,'Solo hoy'],[1,'Hoy y mañana'],[7,'Una semana']].map(([n,t])=>`<button class='pn-gbtn${diasSel===n?' on':''}' data-dias='${n}'>${t}</button>`).join('')}</div></div>
      <label class='pn-chk'><input type='checkbox' data-msg-c checked> Mandar también por correo</label>
      <button class='pn-go pn-save' data-msg-go>Enviar mensaje</button><div data-msg-r></div></div>
      <div class='pn-card'><h3>Últimos mensajes</h3>${(d.mensajes||[]).length ? d.mensajes.map(m=>`<div class='pn-row pn-sent'><div><small>${esc(m.fecha)} · ${esc(m.de)} · Grupo ${esc(m.grupo)} · ${m.familias} familia${m.familias===1?'':'s'}${m.hasta?' · se ve '+(m.hasta==='solo ese día'?'solo ese día':'hasta el '+esc(m.hasta.toLowerCase())):''}</small><p>${esc(m.mensaje)}</p></div></div>`).join('') : `<p class='pn-empty'>Todavía no se han mandado mensajes.</p>`}</div>`;
  }
  function bindMensajes(d){
    const pane = app.querySelector('[data-pane=mensajes]'); if(!pane) return;
    const ta = pane.querySelector('[data-msg-t]'), go = pane.querySelector('[data-msg-go]'), res = pane.querySelector('[data-msg-r]');
    ta.oninput = () => { borrador = ta.value; };
    pane.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const g = b.dataset.g;
      if(g === 'Todos') gSel = gSel.includes('Todos') ? [] : ['Todos'];
      else { gSel = gSel.filter(x => x !== 'Todos'); gSel = gSel.includes(g) ? gSel.filter(x => x !== g) : gSel.concat(g); }
      pane.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', gSel.includes(x.dataset.g)));
    });
    pane.querySelectorAll('[data-dias]').forEach(b => b.onclick = () => { diasSel = +b.dataset.dias; pane.querySelectorAll('[data-dias]').forEach(x => x.classList.toggle('on', +x.dataset.dias === diasSel)); });
    go.onclick = async () => {
      const t = ta.value.trim();
      if(!gSel.length){ res.innerHTML = `<div class='pn-msg'>Elige el grupo.</div>`; return; }
      if(t.length < 3){ res.innerHTML = `<div class='pn-msg'>Escribe el mensaje.</div>`; return; }
      if(!go.dataset.ok){ go.dataset.ok = 1; go.textContent = '¿Enviar a ' + gSel.join(', ') + '?'; return; }
      go.disabled = true; go.textContent = 'Enviando…';
      try{
        const r = await post(Object.assign({}, auth, {accion:'mensaje', grupos:gSel, dias:diasSel, mensaje:t, correo: pane.querySelector('[data-msg-c]').checked}));
        borrador = ''; gSel = []; diasSel = 0;
        d.mensajes = r.mensajes; d.grupos = r.grupos;
        pane.innerHTML = mensajesPane(d); bindMensajes(d);
        pane.querySelector('[data-msg-r]').innerHTML = `<div class='pn-ok'>Enviado a ${r.familias} familia${r.familias===1?'':'s'}${r.correos?' (también por correo)':''}.</div>`;
      }catch(x){ go.disabled = false; delete go.dataset.ok; go.textContent = 'Enviar mensaje'; res.innerHTML = `<div class='pn-msg'>${esc(x.message)}</div>`; }
    };
  }

  function render(d){
    CL = []; ES_ADMIN = d.rol !== 'instructor';
    if(d.aCargo) ACARGO = d.aCargo;
    if(d.miGrupo) MIOS = d.miGrupo;
    LISTA = d.lista || [];
    const tabs = d => `<div class='pn-tabs'><button class='pn-tab' data-tab='clases'>Clases</button><button class='pn-tab' data-tab='alumnos'>Alumnos</button><button class='pn-tab' data-tab='mensajes'>Mensajes</button>${d.rol === 'instructor' ? '' : `<button class='pn-tab' data-tab='pagos'>Pagos${d.actual.faltan.length?`<i>${d.actual.faltan.length}</i>`:''}</button><button class='pn-tab' data-tab='avisos'>Avisos${(d.sinGrupo.length + d.revisar.length)?`<i>${d.sinGrupo.length + d.revisar.length}</i>`:''}</button>`}</div>`;
    const tabsOn = () => {
      const show = t => { tab = t; try{ sessionStorage.setItem(KEY + '-tab', t); }catch(_){}
        app.querySelectorAll('.pn-tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
        app.querySelectorAll('.pn-pane').forEach(p => p.hidden = p.dataset.pane !== t);
        if(t === 'alumnos'){ cargarNotas().then(pintarAlumnos); if(ES_ADMIN) cargarInformes().then(pintarAlumnos); }
         };
      app.querySelectorAll('.pn-tab').forEach(b => b.onclick = () => show(b.dataset.tab));
      show(app.querySelector(`.pn-tab[data-tab='${tab}']`) ? tab : 'clases');
      ponerSelector();
      bindLista(); copiar(); bindMensajes(d);
    };
    if(d.rol === 'instructor'){
      app.innerHTML = `<div class='pn-head'><div><h1>Clases Storm</h1><p>${esc(d.hoy)}</p></div><button class='pn-link' id='pn-out'>Salir</button></div>` + tabs(d) +
        `<div class='pn-pane' data-pane='clases'>` + (d.clases.length ? d.clases.map(claseCard).join('') : `<div class='pn-card'><p class='pn-empty'>No hay clases cargadas.</p></div>`) +
        `<p class='pn-note'>↪ = alumno que se cambió a esta clase.</p></div><div class='pn-pane' data-pane='lista'>${listaPane()}</div><div class='pn-pane' data-pane='alumnos'><div class='pn-skel'></div></div><div class='pn-pane' data-pane='mensajes'>${mensajesPane(d)}</div><div class='pn-verano' hidden><div class='pn-skel'></div></div>`;
      document.getElementById('pn-out').onclick = () => { borrar(); auth = null; login(); };
      tabsOn();
      return;
    }
    const A = d.actual, M = cap(A.mes.split(' ')[0]);
        const dif = d.pasado.recaudado ? A.recaudado - d.pasado.recaudado : null;
    let h = `<div class='pn-head'><div><h1>Panel Storm</h1><p>${esc(d.hoy)}</p></div><button class='pn-link' id='pn-out'>Salir</button></div>
      <div class='pn-stats'>
        <div class='pn-stat pn-stat--main'><small>Recaudado en ${esc(M)}</small><b>${clp(A.recaudado)}</b><em>${A.alumnos} alumno${A.alumnos===1?'':'s'}${dif!==null?' · '+(dif>=0?'+':'−')+clp(Math.abs(dif))+' vs '+esc(d.pasado.mes.split(' ')[0]):''}</em></div>
        <div class='pn-stat${A.faltan.length?' pn-stat--warn':''}'><small>Faltan por pagar</small><b>${A.faltan.reduce((t,f)=>t+f.alumnos.length,0)}</b><em>${A.porCobrar?'por cobrar '+clp(A.porCobrar):'alumnos'}</em></div>
        <div class='pn-stat'><small>Ya pagaron ${esc(cap(d.proximo.mes.split(' ')[0]))}</small><b>${d.proximo.alumnos}</b><em>${clp(d.proximo.recaudado)}</em></div>
      </div>
      ${tabs(d)}`;

    h += `<div class='pn-pane' data-pane='clases'>` + (d.clases.length ? d.clases.map(claseCard).join('') : `<div class='pn-card'><p class='pn-empty'>No hay clases cargadas en el Calendario.</p></div>`) + `</div>`;

    h += `<div class='pn-pane' data-pane='lista'>${listaPane()}</div><div class='pn-pane' data-pane='alumnos'><div class='pn-skel'></div></div><div class='pn-pane' data-pane='mensajes'>${mensajesPane(d)}</div><div class='pn-verano' hidden><div class='pn-skel'></div></div>`;
    h += `<div class='pn-pane' data-pane='pagos'>
      <div class='pn-card'><h3>Faltan por pagar ${esc(M)}</h3>
        ${A.faltan.length ? A.faltan.map((f,fi) => `<div class='pn-row pn-row--wrap'><div><b>${f.alumnos.map(esc).join(', ')}</b><small>${esc(f.apoderado||'')}${f.monto?' · '+clp(f.monto):''}${f.recordado?"<span class='pn-tag'>recordatorio enviado</span>":''}</small></div>
          <div class='pn-acts'>${wa(f.telefono) ? `<a class='pn-wa' target='_blank' rel='noopener' href='https://wa.me/${wa(f.telefono)}?text=${encodeURIComponent('Hola '+String(f.apoderado||'').split(' ')[0]+'! Te escribimos de Storm por la mensualidad de '+M+' de '+f.alumnos.join(' y ')+'.')}'>WhatsApp</a>` : (f.correo ? `<a class='pn-link' href='mailto:${esc(f.correo)}'>Correo</a>` : '')}
          ${f.monto ? `<button class='pn-paid' data-paid='${fi}'>Pagó ✓</button>` : ''}</div></div>`).join('')
          : `<p class='pn-empty'>Nadie tiene pagos pendientes este mes. 👌</p>`}
        ${A.faltan.some(f=>f.monto) ? `<p class='pn-sub' style='margin-top:10px'>Cuando te llegue una transferencia, aprieta "Pagó ✓" y queda anotado en la planilla.</p>` : ''}
      </div>
      <div class='pn-card'><h3>Pagaron ${esc(M)}<span class='pn-count'>${A.pagaron.length}</span></h3>

  async function cargarGastos(mes){

      return c ? `<button class='pn-gbtn${vNiv===n?' on':''}' data-vn='${esc(n)}'>${mio(n, vMios)?'★ ':''}${esc(n)}<small>${c}</small></button>` : ''; }).join('')}</div>
    <div class='pn-card'><h3>${vNiv ? esc(vNiv)+' · ' : ''}${sem ? esc(sem.nombre)+' · '+esc(sem.fechas) : 'Todo el verano'}<span class='pn-count'>${lista.length}</span></h3>
      ${lista.length ? vOrden.map(n => { const g = lista.filter(a => a.nivel === n); if(!g.length) return '';
        return `<div class='pn-grp'>${grpHead(n, g.length, v.aCargo, vMios)}${g.map(a => `<div class='pn-vk'><div><b>${esc(a.nombre)}</b>
          <small>${duracion(a)}${esc(a.edad)}${a.tabla?" <span class='pn-tag'>tabla</span>":''}${a.traje?" <span class='pn-tag'>traje</span>":''}${vSem==='todas'?' · '+[['Enero',MES_SEM.ene],['Febrero',MES_SEM.feb]].map(([m,ids]) => { const w = ids.filter(x => a.semanas.includes(x)); return w.length ? m+': '+(w.length===4?'mes completo':w.map(x=>x.replace('s','S')).join(' ')) : ''; }).filter(Boolean).join(' · '):''}${admin?' · '+esc(a.apoderado):''}</small>
          ${a.salud ? `<span class='pn-salud'>⚠︎ ${esc(a.salud)}</span>` : ''}
          ${a.emergencia ? `<small>Emergencia: ${esc(a.emergencia)} ${esc(a.emergenciaTel)}</small>` : ''}
          ${notaBtn(a.nombre)}${admin && a.nivel !== 'Federados' && vCambio !== a.nombre ? `<button class='pn-nv' data-cn='${esc(a.nombre)}'>Cambiar nivel</button>` : ''}</div>
          ${admin && wa(a.telefono) ? `<a class='pn-wa' target='_blank' rel='noopener' href='https://wa.me/${wa(a.telefono)}'>WhatsApp</a>` : ''}
          ${vCambio === a.nombre ? `<div class='pn-nvbox'><p>¿A qué nivel pasa <b>${esc(a.nombre.split(' ')[0])}</b>? Hoy está en ${esc(a.nivel)}.</p>
            <div class='pn-nvops'>${NIV.filter(x => x !== 'Federados').map(x => `<button data-nv='${x}' class='${x===a.nivel?'act':''}${x===vNuevo?' on':''}'${x===a.nivel?' disabled':''}>${x}</button>`).join('')}</div>
            <label><input type='checkbox' id='pn-nvav' checked> Avisar a la familia en la app</label>
            <button class='pn-nvgo' id='pn-nvgo'${vNuevo?'':' disabled'}>Guardar</button><button class='pn-link' id='pn-nvx'>Cancelar</button></div>` : ''}${notaBox(a.nombre, 'Verano')}</div>`).join('')}</div>`; }).join('')
        : `<p class='pn-empty'>${vNiv ? 'No hay niños de '+esc(vNiv)+' esta semana.' : 'Todavía no hay niños inscritos esta semana.'}</p>`}
    </div>`;
    if(admin){
      h += `<button class='pn-vfin' data-vfin>+ Anotar gasto de Verano</button>`;
      if(v.revisar && v.revisar.length) h += `<div class='pn-card'><h3>Pagos para revisar<span class='pn-count'>${v.revisar.length}</span></h3><p class='pn-sub'>Revísalos en la pestaña Pagos de la planilla de Verano: ${v.revisar.map(esc).join(', ')}</p></div>`;
      h += `<div class='pn-card'><h3>Últimos pagos web</h3>${v.ultimos.length ? v.ultimos.map(p => `<div class='pn-row'><div><b>${esc(p.alumnos.join(', '))}</b><small>${esc(p.apoderado)} · ${esc(p.fecha)}${p.codigo?" <span class='pn-tag'>"+esc(p.codigo)+'</span>':''}</small></div><span class='pn-amt'>${p.total ? clp(p.total) : 'Beca'}</span></div>`).join('') : `<p class='pn-empty'>Aún no hay pagos con Mercado Pago. Las inscripciones de antes (Shopify) ya están en la lista.</p>`}</div>`;
      if(v.planilla) h += `<p class='pn-note'><a class='pn-link' href='${esc(v.planilla)}' target='_blank' rel='noopener'>Abrir la planilla de Verano</a></p>`;
    }
    pane.innerHTML = h;
    const vf = pane.querySelector('[data-vfin]'); if(vf) vf.onclick = irAFinanzasVerano;
    pane.querySelectorAll('[data-vs]').forEach(b => b.onclick = () => { vSem = b.dataset.vs; pintarVerano(pane); });
    pane.querySelectorAll('[data-vn]').forEach(b => b.onclick = () => { vNiv = b.dataset.vn; pintarVerano(pane); });
    bindNotas(pane, () => pintarVerano(pane));
    pane.querySelectorAll('[data-cn]').forEach(b => b.onclick = () => { vCambio = b.dataset.cn; vNuevo = ''; vMsg = ''; pintarVerano(pane); });
    pane.querySelectorAll('[data-nv]').forEach(b => b.onclick = () => { vNuevo = b.dataset.nv; const av = pane.querySelector('#pn-nvav').checked; pintarVerano(pane); pane.querySelector('#pn-nvav').checked = av; });
    const nx = pane.querySelector('#pn-nvx'); if(nx) nx.onclick = () => { vCambio = ''; vNuevo = ''; pintarVerano(pane); };
    const go = pane.querySelector('#pn-nvgo');
    if(go) go.onclick = async () => {
      go.disabled = true; go.textContent = 'Guardando…';
      try{
        const r = await (await fetch(API_VERANO, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify(Object.assign({}, auth, {accion:'nivel', alumno: vCambio, nivel: vNuevo, avisar: pane.querySelector('#pn-nvav').checked}))})).json();
        if(!r.ok) throw new Error(r.error || 'No se pudo cambiar el nivel.');
        VER = Object.assign({ miGrupo: VER.miGrupo }, r); const c = r.cambio || {};
        vMsg = `Listo: ${c.alumno || vCambio} ahora está en ${c.nivel || vNuevo}.` + (c.avisado ? ' Le avisamos a la familia en la app.' : '');
        vCambio = ''; vNuevo = ''; pintarVerano(pane); window.scrollTo({top:0, behavior:'smooth'});
      }catch(x){ go.disabled = false; go.textContent = 'Guardar'; const e = pane.querySelector('.pn-nverr') || go.parentNode.appendChild(Object.assign(document.createElement('p'), {className:'pn-nverr'})); e.style.cssText = 'color:#a12c1c;margin:8px 0 0'; e.textContent = x.message; }
    };
  }

  async function load(){
    if(!auth) return login();
    app.innerHTML = `<div class='pn-skel'></div><div class='pn-skel'></div><div class='pn-skel'></div>`;
    try{ render(await post(Object.assign({}, auth, {accion:'panel'}))); }
    catch(x){
      if(/sesión|expir|acceso/i.test(x.message)){ const e = auth.email; borrar(); auth = null; return login(e, /acceso/.test(x.message) ? x.message : 'Por seguridad, vuelve a entrar.'); }
      app.innerHTML = `<div class='pn-msg'>${esc(x.message)}</div>`;
    }
  }
  load();
})();
</script>

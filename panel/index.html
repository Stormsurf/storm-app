<script>
// Versión nueva: si subimos cambios, la app se recarga sola al volver a abrirla (sin perder lo que se está escribiendo).
(() => {
  let etag = null;
  const ver = async () => { try{ const r = await fetch(location.pathname, {method:'HEAD', cache:'no-store'}); return r.headers.get('etag') || r.headers.get('last-modified'); }catch(_){ return null; } };
  ver().then(e => etag = e);
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState !== 'visible' || !etag) return;
    const e = await ver(); const a = document.activeElement;
    if(e && e !== etag && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.value)) location.reload();
  });
})();
</script>


</main>

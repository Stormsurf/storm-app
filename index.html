<main>
<style>
.mc{--aa:#61A1C8;--aa-dk:#2d6e94;--aa-soft:#E6F1F8;--ink:#2C2C2B;--line:rgba(44,44,43,.09);max-width:680px;margin:0 auto;color:var(--ink)}
.mc-hero{text-align:center;padding:4px 0 2px}
.mc-hero img{width:min(280px,64%);height:auto;display:block;margin:0 auto}
.mc-hero h1{margin:12px 0 0;font-family:var(--font-heading-family);font-weight:500;font-size:2.8rem}
.mc-hero .mc-lead{margin:6px auto 0;max-width:44ch;font-size:1.5rem;line-height:1.5;opacity:.75}
.mc-hero .mc-lead p{margin:0}
.mc-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px;box-shadow:0 1px 2px rgba(44,44,43,.04)}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:999px}
.mc-top span{font-size:1.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-top b{font-weight:600}
.mc-link{background:none;border:0;padding:0;font:inherit;font-size:1.35rem;color:var(--aa-dk);text-decoration:underline;cursor:pointer;flex:none}
.mc-h2{margin:26px 0 0;font-family:var(--font-heading-family);font-weight:500;font-size:2rem;display:flex;align-items:center;gap:10px}
.mc-h2:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--aa);flex:none}
.mc-kid{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mc-kid h3{margin:0;font-family:var(--font-heading-family);font-weight:500;font-size:2.2rem;line-height:1.2}
.mc-kid p{margin:4px 0 0;font-size:1.4rem;opacity:.72}
.mc-paid{flex:none;text-align:right;font-size:1.2rem;line-height:1.3}
.mc-paid b{display:inline-block;background:var(--aa-soft);color:var(--aa-dk);font-weight:600;font-size:1.3rem;padding:4px 10px;border-radius:999px}
.mc-paid small{display:block;opacity:.6;margin-top:4px}
.mc-list{margin-top:14px;border-top:1px solid var(--line)}
.mc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mc-row:last-child{border-bottom:0}
.mc-row b{font-weight:600;font-size:1.5rem}
.mc-row small{display:block;opacity:.65;font-size:1.3rem;margin-top:2px}
.mc-tag{display:inline-block;font-size:1.1rem;padding:2px 9px;border-radius:20px;background:var(--aa-soft);color:var(--aa-dk);margin-left:6px;vertical-align:middle}
.mc-btn{background:#fff;border:1.5px solid var(--aa);color:var(--aa-dk);border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;font-size:1.3rem;cursor:pointer}
.mc-btn:hover{background:var(--aa-soft)}
.mc-lock{font-size:1.2rem;opacity:.5}
.mc-opts{width:100%;margin-top:4px;padding:12px;background:var(--aa-soft);border-radius:14px}
.mc-opts[hidden]{display:none}
.mc-opts>p{margin:0 0 8px;font-size:1.35rem}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc-opt{background:#fff;border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;font-size:1.35rem;cursor:pointer;text-align:left;color:var(--ink)}
.mc-opt:hover,.mc-opt.on{border-color:var(--aa)}
.mc-opt small{display:block;opacity:.65}
.mc-confirm{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.mc-confirm[hidden]{display:none}
.mc-confirm p{flex:1 1 100%;margin:0;font-size:1.35rem}
.mc-go{display:inline-block;border:0;border-radius:999px;background:var(--aa);color:#fff;text-decoration:none;font:inherit;font-weight:600;font-size:1.5rem;padding:14px 26px;cursor:pointer;text-align:center}
.mc-go:hover{filter:brightness(.95)}
.mc-go[disabled]{opacity:.6;cursor:default}
.mc-go--sm{font-size:1.35rem;padding:10px 18px}
.mc-msg{padding:14px 16px;border-radius:14px;margin-top:14px;font-size:1.45rem;line-height:1.45}
.mc-msg--ok{background:var(--aa-soft)}.mc-msg--err{background:#f6e3df}
.mc-note{font-size:1.3rem;opacity:.65;margin-top:16px;line-height:1.5;text-align:center}
.mc-login{text-align:center}
.mc-login p{margin:0 auto 14px;max-width:38ch;font-size:1.5rem;line-height:1.5}
.mc-in{display:block;width:100%;max-width:340px;margin:0 auto 12px;box-sizing:border-box;border:1.5px solid rgba(44,44,43,.18);border-radius:12px;padding:13px 14px;font:inherit;font-size:1.6rem;text-align:center;background:#fff;color:var(--ink)}
.mc-in:focus{outline:none;border-color:var(--aa)}
.mc-in--code{letter-spacing:.4em;font-size:2.2rem;font-weight:600}
.mc-login .mc-go{width:100%;max-width:340px}
.mc-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--aa-soft);border-color:transparent}
.mc-cta p{margin:0;font-size:1.45rem}
.mc-cta b{display:block;font-size:1.6rem}
.mc-ren p{flex-basis:100%}
.mc-ren ul{flex-basis:100%;list-style:none;margin:0;padding:0;font-size:1.4rem;line-height:1.5}
.mc-ren li b{display:inline;font-size:inherit}
.mc-ren__otro{font-size:1.3rem}
.mc-asis{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:1.35rem}
.mc-asis i{flex:1;height:6px;border-radius:6px;background:var(--aa-soft);overflow:hidden;max-width:160px}
.mc-asis i span{display:block;height:100%;background:var(--aa)}
.mc-enc{background:var(--ink);color:#fff;border-color:transparent}
.mc-enc h3{margin:0;font-family:var(--font-heading-family);font-weight:500;font-size:2rem}
.mc-enc p{margin:4px 0 0;font-size:1.35rem;opacity:.75}
.mc-stars{display:flex;gap:6px;margin-top:14px}
.mc-star{flex:1;border:1.5px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:12px;padding:10px 0 8px;font:inherit;font-size:1.1rem;cursor:pointer;line-height:1.2}
.mc-star b{display:block;font-size:2rem;font-weight:400;line-height:1}
.mc-star.on{background:#fff;color:var(--ink);border-color:#fff}
.mc-enc textarea{display:block;width:100%;box-sizing:border-box;margin-top:12px;border:0;border-radius:12px;padding:11px 12px;font:inherit;font-size:1.45rem;min-height:70px;resize:vertical}
.mc-enc .mc-go{margin-top:12px;background:#fff;color:var(--ink)}
.mc-ev{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.mc-ev:last-child{border-bottom:0}
.mc-ev__d{flex:none;align-self:flex-start;width:52px;text-align:center;border-radius:12px;background:var(--aa-soft);color:var(--aa-dk);padding:6px 0;line-height:1.1}
.mc-ev__d b{display:block;font-size:2rem;font-weight:600}
.mc-ev__d small{font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em}
.mc-ev h4{margin:0;font-size:1.55rem;font-weight:600}
.mc-ev p{margin:3px 0 0;font-size:1.3rem;opacity:.7;line-height:1.4}
.mc-calmes__card{padding:14px 12px}
.mc-cal__sem,.mc-cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc-cal__sem span{text-align:center;font-size:1.15rem;font-weight:600;opacity:.45;padding-bottom:4px}
.mc-cal__d{position:relative;min-height:52px;border:0;border-radius:10px;background:transparent;font:inherit;color:var(--ink);padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;cursor:pointer}
.mc-cal__d:disabled{cursor:default}
.mc-cal__d b{font-size:1.45rem;font-weight:500;line-height:1;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc-cal__d i{font-style:normal;font-size:1.02rem;font-weight:600;letter-spacing:.01em;line-height:1;padding:3px 5px;border-radius:999px;white-space:nowrap}
.mc-cal__d--surf{background:#EEF5FA}.mc-cal__d--surf i{background:var(--aa);color:#fff}
.mc-cal__d--skate{background:#FBF3DC}.mc-cal__d--skate i{background:#E9B93A;color:#3d2f05}
.mc-cal__d--vac{background:#E7F4EE}.mc-cal__d--vac i{background:#3E9B76;color:#fff}
.mc-cal__d--no{background:#F6F4F1}.mc-cal__d--no b{text-decoration:line-through;opacity:.45}.mc-cal__d--no i{background:none;color:#B5543C;padding:3px 0;font-size:.95rem}
.mc-cal__d--pas{opacity:.42}
.mc-cal__d small{font-size:.95rem;line-height:1;opacity:.6}
.mc-cal__av--otro{background:#FBF3DC}
.mc-cal__d--hoy b{background:var(--ink);color:#fff;font-weight:700}
.mc-cal__d--mia{box-shadow:inset 0 0 0 2px var(--aa-dk)}
.mc-cal__d--sel{outline:2px solid var(--ink);outline-offset:1px}
.mc-cal__det{margin-top:12px;padding:10px 12px;border-radius:12px;background:#F6F4F1;font-size:1.4rem;line-height:1.4;min-height:44px}
.mc-cal__det p{margin:0}.mc-cal__det p+p{margin-top:2px}
.mc-cal__tip{opacity:.55;text-align:center}
.mc-cal__tuya{color:var(--aa-dk);font-weight:600}
.mc-cal__av{list-style:none;margin:10px 0 0;padding:0;font-size:1.4rem;line-height:1.4}
.mc-cal__av li{padding:8px 12px;border-radius:10px;margin-top:6px}
.mc-cal__av--no{background:#FBEDE8}.mc-cal__av--vac{background:#E7F4EE}
.mc-cal__ley{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:1.2rem;opacity:.75}
.mc-cal__k{display:inline-flex;align-items:center;gap:6px}
.mc-cal__k::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--aa)}
.mc-cal__k--skate::before{background:#E9B93A}.mc-cal__k--vac::before{background:#3E9B76}.mc-cal__k--no::before{background:#E2C5BB}
.mc-cal__k--mia::before{background:none;box-shadow:inset 0 0 0 2px var(--aa-dk)}
.mc-calmes__tabs{display:flex;gap:8px;margin-bottom:10px}
.mc-calmes__tabs:empty{display:none}
.mc-calmes__tab{flex:1;padding:9px 10px;border:1px solid rgba(44,44,43,.16);border-radius:10px;background:#fff;font:inherit;font-size:1.4rem;cursor:pointer}
.mc-calmes__tab.on{background:var(--aa);border-color:var(--aa);color:#fff}
.mc-ev .mc-link{font-size:1.3rem;margin-top:6px;display:inline-block}
.mc-old{margin-top:14px}
.mc-old summary{cursor:pointer;font-size:1.4rem;color:var(--aa-dk);padding:6px 0}
.mc-skel{height:120px;border-radius:18px;margin-top:14px;background:linear-gradient(90deg,#fff 0%,#f3f1ee 50%,#fff 100%);background-size:200% 100%;animation:mcsk 1.2s infinite linear}
@keyframes mcsk{to{background-position:-200% 0}}
@media (max-width:599px){.mc-card{padding:18px;border-radius:16px}.mc-grid{grid-template-columns:1fr}.mc-cta .mc-go{width:100%}}
.mc-msgs{margin-top:16px}
.mc-msg1{background:#fff;border:1px solid rgba(44,44,43,.09);border-left:4px solid #61A1C8;border-radius:16px;padding:14px 16px;margin-top:10px}
.mc-msg1 small{display:flex;align-items:center;gap:6px;font-size:1.2rem;opacity:.65;margin-bottom:6px}
.mc-msg1 small i{font-style:normal;font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;background:#61A1C8;color:#fff;border-radius:999px;padding:1px 7px;opacity:1}
.mc-msg1 p{margin:0;font-size:1.5rem;line-height:1.5;white-space:pre-line}
.mc-msg1--new{background:#E6F1F8}
.mc-sw{display:flex;gap:6px;margin-top:12px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:999px}
.mc-sw button{flex:1;border:0;border-radius:999px;background:none;font:inherit;font-size:1.35rem;font-weight:600;padding:10px 8px;cursor:pointer;color:var(--ink);opacity:.6}
.mc-sw button.on{background:var(--aa);color:#fff;opacity:1}
.mc-sw button.on[data-vista=verano]{background:#FADF70;color:#3B2610}
.mc-hero img.mc-storm{display:none}
.mc-hero--login img.mc-storm{display:block;width:min(260px,66%);margin:6px auto 4px}
body:has(.mc-hero--login) .ap-top{display:none}
.mc-big{display:block;width:min(260px,66%);height:auto;margin:14px auto 6px}
.mc-dos{display:flex;justify-content:center;align-items:center;gap:22px;margin:18px 0 4px}
.mc-dos img{height:52px;width:auto;max-width:46%;object-fit:contain;display:block}
.mc-alogo{display:block;height:70px;width:auto;max-width:80%;object-fit:contain;margin:20px auto 0}
.mc-v{--v-wax:#FADF70;--v-sea:#4A6B70;--v-ink:#3B2610}
.mc-v .mc-aviso{background:var(--v-wax);border:2px solid var(--v-ink);border-radius:18px;padding:16px 18px;margin-top:14px;color:var(--v-ink)}
.mc-v .mc-aviso b{display:block;font-family:var(--font-heading-family);font-size:2rem;font-weight:600;margin-bottom:4px}
.mc-v .mc-aviso p{margin:0;font-size:1.5rem;line-height:1.5}
.mc-v .mc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mc-v .mc-tags span{font-size:1.25rem;font-weight:600;padding:3px 10px;border-radius:999px;background:#F6EDC4;color:var(--v-ink)}
.mc-v .mc-tags span.y{background:var(--v-wax)}
.mc-v .mc-lbl{font-size:1.15rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin:16px 0 6px}
.mc-v .mc-chips{display:flex;flex-wrap:wrap;gap:6px}
.mc-v .mc-chips span{border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:1.35rem}
.mc-v .mc-dia{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:1.45rem}
.mc-v .mc-dia b{flex:none;width:88px;font-weight:600}
.mc-v .mc-dia.off span{opacity:.5}
.mc-v .mc-wa{background:#25D366;color:#fff}
</style>
<section class='storm-section color-scheme-1 gradient'>
  <div class='storm-wrap mc'>
    <div class='mc-hero'>
      <img class='mc-storm' src='/img/storm-logo.png' alt='Storm Surf Academy' width='400' height='216'>
      <h1>Mi clase</h1>
      <div class='mc-lead'><p>Revisa las clases de tus hijos, sus días y lo que tienes pagado.</p></div>
    </div>
    <div id='mc-app'><div class='mc-skel'></div></div>
  </div>
</section>

<script>
(()=>{
  const API = "https://script.google.com/macros/s/AKfycbyFZiJBhEoWR3-mekjXfea3O0BbDItazLHQRUkCpWOUZOwJ4612kgiGsg4ocWpGBgO3/exec";
  const PAY = "https://www.stormsurf.cl/products/mensualidad-academia-anual";
  const NOTA = "Puedes mover una clase avisando 3 d\u00edas antes. Solo aplica a surf en los planes B\u00e1sico y Medio.";
  const KEY = 'storm-mi-clase';
  // Academia de Verano: mismo ingreso (las dos planillas firman con la misma clave).
  const API_VERANO = "https://script.google.com/macros/s/AKfycbzSHDu8whWWNwq-EFwaWqwKOtyU5pnyPuixutUI8sd5twFaTjDibN11TA3bMH_UddTo/exec";
  const LOGO_ANUAL = '/img/academia-anual-logo.png';
  const LOGO_VERANO = '/img/verano-logo.png';
  let fuente = API;
  const app = document.getElementById('mc-app');
  const q = new URLSearchParams(location.search);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
  const clp = n => '$' + Math.round(n).toLocaleString('es-CL');
  const guardar = s => { try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_){} };
  const leer = () => { try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(_){ return null; } };
  const borrar = () => { try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY+'-datos'); }catch(_){} };
  // Datos guardados de la última visita: se muestran al tiro mientras llega lo nuevo.
  const leerDatos = () => { try{ const c = JSON.parse(localStorage.getItem(KEY+'-datos') || 'null'); return c && auth && c.email === auth.email ? c.D : null; }catch(_){ return null; } };
  const guardarDatos = d => { try{ localStorage.setItem(KEY+'-datos', JSON.stringify({email: auth.email, D: d})); }catch(_){} };

  // Sesión: 1) vuelta del pago (link firmado), 2) la guardada en este navegador, 3) cuenta de la tienda.
  let auth = null;
  if(q.get('e') && q.get('ts') && q.get('f')) auth = {email:q.get('e'), ts:q.get('ts'), firma:q.get('f')};
  else auth = leer();
  
  if(auth) guardar(auth);
  if(q.get('e')){ ['e','ts','f'].forEach(k=>q.delete(k)); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }

  let msg = q.get('pago')==='pendiente' ? `<div class='mc-msg mc-msg--ok'>Tu pago está en proceso. Cuando Mercado Pago lo apruebe te llegará un correo y aparecerá aquí.</div>`
    : q.get('pago')==='ok' ? `<div class='mc-msg mc-msg--ok'>¡Pago recibido! Te enviamos la confirmación por correo.</div>` : '';
  const revisar = (q.get('ref') && API) ? post({accion:'revisar-pago', ref:q.get('ref')}).catch(()=>null) : null;

  async function post(body, url){
    url = url || API;
    if(!url) throw new Error('El sistema aún no está conectado.');
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || 'Error');
    return d;
  }
  const call = body => post(Object.assign({}, auth, body));

  // ---------- Entrar con código ----------
  function login(email, err, paso){
    hero();
    app.innerHTML = msg + `<div class='mc-card mc-login'>
      ${paso==='codigo'
        ? `<p>Te enviamos un código de 6 números a <b>${esc(email)}</b>. Escríbelo aquí:</p>
           <input class='mc-in mc-in--code' id='mc-code' inputmode='numeric' autocomplete='one-time-code' maxlength='6' placeholder='······'>
           <button class='mc-go' id='mc-ok'>Entrar</button>
           <p class='mc-note' style='margin-top:12px'><button class='mc-link' id='mc-back'>Usar otro correo o pedir otro código</button></p>`
        : `<p>Entra con el correo que usaste al pagar la Academia. Te mandamos un código, sin contraseñas.</p>
           <input class='mc-in' id='mc-email' type='email' autocomplete='email' placeholder='tu@correo.cl' value='${esc(email||'')}'>
           <button class='mc-go' id='mc-ok'>Recibir código</button>`}
      ${err ? `<div class='mc-msg mc-msg--err' style='text-align:left'>${esc(err)}</div>` : ''}
    </div>
    <p class='mc-note'>¿Aún no inscribes a tus hijos? <a href='${esc(PAY)}'>Academia Anual</a> · <a href='${esc(PAY.replace(/mensualidad-academia-anual.*$/, 'academia-de-verano-2027'))}'>Academia de Verano</a></p>`;
    const ok = document.getElementById('mc-ok');
    const input = document.getElementById(paso==='codigo' ? 'mc-code' : 'mc-email');
    input.focus();
    input.addEventListener('keydown', e => { if(e.key==='Enter') ok.click(); });
    if(paso==='codigo'){
      document.getElementById('mc-back').onclick = () => login(email);
      input.addEventListener('input', () => { input.value = input.value.replace(/\D/g,''); if(input.value.length===6) ok.click(); });
      ok.onclick = async () => {
        ok.disabled = true; ok.textContent = 'Entrando…';
        try{ const s = await post({accion:'entrar', email, codigo:input.value}, fuente); auth = {email:s.email, ts:s.ts, firma:s.firma}; guardar(auth); load(); }
        catch(x){ login(email, x.message, 'codigo'); }
      };
    } else {
      ok.onclick = async () => {
        const e = input.value.trim().toLowerCase();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return login(e, 'Revisa el correo.');
        ok.disabled = true; ok.textContent = 'Enviando…';
        try{ fuente = API; await post({accion:'pedir-codigo', email:e}); login(e, '', 'codigo'); }

    if(ren){
      h += `<div class='mc-card mc-cta mc-ren'><p><b>Renovar ${esc(cap(ren.mes.split(' ')[0]))}</b>Mismo plan y días, con todas las clases del mes.</p>
        <ul>${ren.alumnos.map(a=>`<li><b>${esc(a.nombre)}</b> · Plan ${esc(a.plan)}${a.dia?' · '+esc(a.dia):''}${a.yoga?' + Yoga':''}${a.beca?' · $'+Number(a.beca).toLocaleString('es-CL'):''}</li>`).join('')}</ul>
        <a class='mc-go mc-go--sm' href='${esc(PAY + (PAY.indexOf('?')<0?'?':'&') + 'renovar=' + encodeURIComponent(JSON.stringify(ren)))}'>Pagar en un toque</a>
        <a class='mc-link mc-ren__otro' href='${esc(PAY)}'>Elegir otro plan</a></div>`;
    } else if(d.alumnos.length && d.alumnos.every(a => a.beca && a.beca.valor === 0)){
      h += `<div class='mc-card mc-cta'><p><b>Beca Storm</b>Sus clases se anotan solas cada mes. No tienes nada que pagar.</p></div>`;
    } else {
      h += `<div class='mc-card mc-cta'><p><b>¿Toca pagar el próximo mes?</b>Elige el plan y sus clases quedan agendadas.</p><a class='mc-go mc-go--sm' href='${esc(PAY)}'>Pagar mensualidad</a></div>`;
    }
    h += `<div class='mc-calmes' data-calmes hidden><h2 class='mc-h2'>Calendario Academia</h2><div class='mc-card mc-calmes__card'><div class='mc-calmes__tabs' data-calmes-tabs></div><div data-calmes-grid></div></div></div>`;
    if((d.eventos || []).length) h += eventosCard(d.eventos);
    if(pasados.length){
      h += `<details class='mc-old'><summary>Meses anteriores (${pasados.length})</summary>` + pasados.map(a=>alumnoCard(a, d.alumnos.indexOf(a), d.aviso)).join('') + `</details>`;
    }
    app.innerHTML = h;
    bindSw();
    marcarVistos(d.mensajes || []);
    calendariosMes([].concat(...activos.map(a => (a.clases||[]).map(c => c.fecha))));
    document.getElementById('mc-out').onclick = () => { borrar(); auth = null; msg = ''; D = {anual:null, verano:null}; vista = ''; hero(); login(); };
    app.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => agregarEvento(d.eventos[+b.dataset.ev]));
    app.querySelectorAll('[data-enc]').forEach(card => {
      const e = d.encuesta[+card.dataset.enc]; let nota = 0;
      card.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { nota = +b.dataset.n; card.querySelectorAll('[data-n]').forEach(x => x.classList.toggle('on', +x.dataset.n <= nota)); card.querySelector('[data-mas]').hidden = false; });
      card.querySelector('[data-env]').onclick = async (ev) => {
        ev.target.disabled = true; ev.target.textContent = 'Enviando…';
        try{ await call({accion:'encuesta', alumno:e.alumno, mes:e.mes, nota, comentario:card.querySelector('textarea').value.trim()});
          card.innerHTML = `<h3>¡Gracias! 🌊</h3><p>Lo leemos todo el equipo Storm.</p>`; d.encuesta = d.encuesta.filter(x => x !== e); }
        catch(x){ ev.target.disabled = false; ev.target.textContent = 'Enviar'; }
      };
    });
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const o=document.getElementById('o-'+b.dataset.open); o.hidden=!o.hidden; b.textContent = o.hidden ? 'Mover' : 'Cerrar'; });
    app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.pick, [ai,ci] = id.split('-').map(Number);
      const a = d.alumnos[ai], c = a.clases[ci], o = c.opciones.find(x=>x.fecha===b.dataset.hacia);
      app.querySelectorAll(`[data-pick='${id}']`).forEach(x=>x.classList.toggle('on', x===b));
      const k = document.getElementById('k-'+id);
      k.hidden = false; k.dataset.hacia = o.fecha;
      k.querySelector('p').innerHTML = `Mover la clase de <b>${esc(a.alumno)}</b> del <b>${esc(c.texto)}</b> al <b>${esc(o.texto)}</b>.`;
    });
    app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ const id=b.dataset.cancel; document.getElementById('k-'+id).hidden=true; app.querySelectorAll(`[data-pick='${id}']`).forEach(x=>x.classList.remove('on')); });
    app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{
      const id = b.dataset.mv, [ai,ci] = id.split('-').map(Number);
      const a = d.alumnos[ai], c = a.clases[ci], hacia = document.getElementById('k-'+id).dataset.hacia;
      app.querySelectorAll('button').forEach(x=>x.disabled=true); b.textContent = 'Moviendo…';
      try{
        const r = await call({accion:'mover', alumno:a.alumno, mes:a.mes, desde:c.fecha, hacia});
        msg = `<div class='mc-msg mc-msg--ok'>Listo. ${esc(r.mensaje)} Te enviamos un correo de confirmación.</div>`;
        D.anual = r; render(r); window.scrollTo({top: app.offsetTop - 20, behavior:'smooth'});
      }catch(x){ msg = `<div class='mc-msg mc-msg--err'>${esc(x.message)}</div>`; load(); }
    });
  }
  async function load(){
    if(!auth) return login();
    const viejo = q.get('pago') ? null : leerDatos();
    const elegirVista = () => {
      let pref = ''; try{ pref = localStorage.getItem(VISTA) || ''; }catch(_){}
      const m = new Date().getMonth();
      vista = !hayVerano() ? 'anual' : !hayAnual() ? 'verano' : (vista || pref || (m < 2 ? 'verano' : 'anual'));
      if(q.get('pago')) vista = hayAnual() ? 'anual' : vista;
    };
    if(viejo){ D = viejo; elegirVista(); mostrar(); }
    else app.innerHTML = `<div class='mc-skel'></div><div class='mc-skel'></div>`;
    try{
      const ver = API_VERANO ? post(Object.assign({accion:'mi-verano'}, auth), API_VERANO).catch(() => null) : Promise.resolve(null);
      const anu = call({accion:'mis-clases'}).catch(x => { if(/sesión|expir/i.test(x.message)) throw x; return null; });
      const [a, v] = await Promise.all([anu, ver]);
      if(!a && !(v && v.hijos && v.hijos.length)){ if(viejo) return; throw new Error('No pudimos cargar tus clases. Intenta de nuevo en un rato.'); }
      const nuevo = {anual: a || {alumnos:[]}, verano: v};
      guardarDatos(nuevo);
      if(viejo && JSON.stringify(viejo) === JSON.stringify(nuevo)) return;
      D = nuevo;
      elegirVista();
      mostrar();
    }
    catch(x){
      if(/sesión|expir/i.test(x.message)){ borrar(); const e = auth.email; auth = null; return login(e, 'Por seguridad, vuelve a entrar.'); }
      if(viejo) return;
      app.innerHTML = msg + `<div class='mc-msg mc-msg--err'>${esc(x.message)}</div>`;
    }
  }
  Promise.resolve(revisar).then(load);
})();
</script>

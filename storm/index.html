<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storm</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFECE8">
<link rel="manifest" href="/storm/manifest.webmanifest">
<link rel="icon" href="/icons/storm-app-192.png">
<link rel="apple-touch-icon" href="/icons/storm-app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Storm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=1">
<link rel="stylesheet" href="/panel/panel.css?v=1">
<script>window.STORM_SHELL = true;</script>
<script src="/agenda/escuela.js?v=15"></script>
<style>
.pn-go{background:#0f6e74}.pn-in:focus{border-color:#0f6e74}
.ap-top{display:none}
main .pn{max-width:1440px}
/* plataforma: barra abajo en el celular, menú a la izquierda en el computador */
.sp-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.04)}
.sp-brand,.sp-yo,.sp-sep,.sp-nav [data-solo-pc]{display:none}
.sp-ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font:inherit;font-size:1.05rem;font-weight:600;color:#8a8986;padding:6px 2px;cursor:pointer;border-radius:12px;min-width:0}
.sp-ni span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp-ni svg{width:24px;height:24px}
.sp-ni.on{color:#0f6e74}
.sp-main{padding-bottom:100px;min-width:0}
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.sp-top h1{margin:0;font-size:2.4rem;font-weight:600;line-height:1.15}
.sp-top p{margin:2px 0 0;font-size:1.3rem;color:#8a8986}
.sp-area[hidden]{display:none}
.sp-panel{max-width:900px}
.sp-panel .pn-sw{display:none}
.sp-mas{position:fixed;inset:0;z-index:40;background:rgba(30,30,28,.45);display:flex;align-items:flex-end}
.sp-mas>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.sp-mas button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;font:inherit;font-size:1.6rem;padding:14px 8px;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.sp-mas button:last-child{border-bottom:0}
.sp-mas svg{width:26px;height:26px;color:#0f6e74}
.sp-mas small{display:block;font-size:1.2rem;color:#8a8986}
/* Hoy */
.sp-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sp-tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.sp-tile i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#E3F1F1;color:#0f6e74;margin-bottom:4px}.sp-tile i svg{width:22px;height:22px}
.sp-tile b{font-size:2.6rem;line-height:1}.sp-tile span{font-size:1.3rem;color:#55544f}.sp-tile small{font-size:1.15rem;color:#8a8986}
.sp-tile.warn i{background:#fbeee2;color:#b5662b}.sp-tile.ok i{background:#e5f2ea;color:#2f7a4d}
.sp-h3{font-size:1.25rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0f6e74;margin:22px 0 8px}
.sp-line{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid #0f6e74;border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;width:100%;font:inherit;text-align:left;color:var(--ink)}
.sp-line .h{font-size:1.7rem;font-weight:700;min-width:58px}
.sp-line b{display:block;font-size:1.45rem;font-weight:600}.sp-line small{display:block;font-size:1.2rem;color:#8a8986}
.sp-line .tag{margin-left:auto;flex:none;border-radius:999px;padding:3px 10px;font-size:1.1rem;font-weight:700;background:#E3F1F1;color:#0f6e74}
.sp-line.anual{border-left-color:#61A1C8}.sp-line.anual .tag{background:#E6F1F8;color:#2d6e94}
.sp-line.verano{border-left-color:#e0b43a}.sp-line.verano .tag{background:#FFF4CC;color:#7a5a00}
.sp-line.cancel{opacity:.55}
.sp-vacio{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:#8a8986;font-size:1.35rem;margin-top:8px}
.sp-pronto{background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line)}
.sp-pronto h3{margin:0 0 6px}.sp-pronto p{margin:0;font-size:1.4rem;color:#55544f;line-height:1.5}
/* Anual / Verano / Finanzas con el mismo diseño de la plataforma (cada academia mantiene su color) */
.sp-panel .pn-tabs{gap:6px;margin:16px 0 4px;padding:0}
.sp-panel .pn-tab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:1.35rem;font-weight:600}
.sp-panel .pn-tab.on{background:var(--aa);border-color:var(--aa);color:#fff}
.sp-panel .pn-tab i{background:#e0a03a}
.sp-panel .pn-stats{gap:10px;margin-top:4px}
.sp-panel .pn-stat{border-radius:18px;padding:14px 16px}
.sp-panel .pn-stat--warn{background:#fff;box-shadow:inset 5px 0 0 #e0a03a}
.sp-panel .pn-stat--warn b{color:#b5662b}
.sp-panel .pn-card{border-radius:18px;box-shadow:inset 5px 0 0 var(--aa)}
.sp-panel .pn-cancel{box-shadow:inset 5px 0 0 #c9c6c0;opacity:.7}
.sp-panel .pn-chips{display:flex;flex-wrap:wrap;gap:6px}
.sp-panel .pn-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;background:#fff;border:1px solid var(--line)}
.sp-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:#fff;flex:none}
.sp-panel .pn-wa{width:44px;height:44px;padding:0;justify-content:center;font-size:0;border-radius:50%}
.sp-panel .pn-wa svg{width:22px;height:22px}
.sp-panel .pn-paid{background:#2f9a6a;border-color:#2f9a6a;color:#fff;padding:9px 14px}
.sp-panel .pn-row{gap:10px}
.sp-panel .pn-verano{--aa:#e0b43a;--aa-dk:#7a5a00;--aa-soft:#FFF4CC}
.sp-panel .pn-verano .pn-tab.on,.sp-panel .pn-verano .pn-gbtn.on{color:#3B2610}
.sp-panel .pn-finz{--aa:#2C2C2B;--aa-dk:#2C2C2B;--aa-soft:#eeece8}
.sp-panel .pn-fsub{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sp-panel .pn-fsub button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:1.35rem;font-weight:600;cursor:pointer;color:var(--ink)}
.sp-panel .pn-fsub button.on{background:#0f6e74;border-color:#0f6e74;color:#fff}
.sp-top{flex-wrap:wrap}
.sp-bus{position:relative;flex:1 1 100%;order:2}
.sp-bus>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a8986;display:flex}.sp-bus>span svg{width:20px;height:20px}
.sp-bus input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 14px 11px 42px;font:inherit;font-size:1.45rem;color:var(--ink)}
.sp-bus input:focus{outline:none;border-color:#0f6e74}
.sp-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:35;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:6px;max-height:60vh;overflow:auto}
.sp-ri{display:flex;align-items:center;gap:6px}
.sp-ri button{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;font:inherit;text-align:left;padding:9px 8px;border-radius:12px;cursor:pointer;color:var(--ink);min-width:0}
.sp-ri button:hover{background:#F3F1EC}
.sp-ri .sp-av{width:36px;height:36px;font-size:1.25rem}
.sp-ri b{display:block;font-size:1.45rem;font-weight:600}.sp-ri small{display:block;font-size:1.2rem;color:#8a8986}
.sp-ri em{margin-left:auto;flex:none;font-style:normal;font-size:1.1rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#E3F1F1;color:#0f6e74}.sp-ri em.a{background:#E6F1F8;color:#2d6e94}
.sp-wa{flex:none;width:38px;height:38px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center}.sp-wa svg{width:20px;height:20px}
.sp-nada{margin:10px;color:#8a8986;font-size:1.35rem}
@media (min-width:1000px){.sp-bus{flex:0 1 360px;order:0}}
.sp-fi>div{position:relative;max-height:88vh;overflow:auto;background:#EFECE8;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sp-fx{position:absolute;right:12px;top:12px;width:38px!important;height:38px;border-radius:50%!important;background:#fff!important;justify-content:center;padding:0!important;font-size:1.5rem!important;border:0!important;color:#555!important}
.sp-fh{display:flex;align-items:center;gap:14px;margin-bottom:14px}.sp-fh .sp-av{width:58px;height:58px;font-size:2rem}
.sp-fh h2{margin:0;font-size:2.2rem;font-weight:600;line-height:1.15}.sp-fh p{margin:2px 0 0;color:#8a8986;font-size:1.3rem}
.sp-fc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp-fc a{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;background:#fff;color:#0f6e74;text-decoration:none;font-weight:700;font-size:1.4rem;border:1px solid var(--line)}
.sp-fc a.w{background:#25D366;color:#fff;border-color:#25D366}.sp-fc svg{width:22px;height:22px}
.sp-fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;border-radius:16px;padding:14px;box-shadow:inset 5px 0 0 #61A1C8}
.sp-fb small{display:block;font-size:1.15rem;color:#8a8986}.sp-fb b{font-size:1.45rem;font-weight:600}.sp-fb b.pend{color:#b5662b}.sp-fb b.ok{color:#2f7a4d}
.sp-fr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fff;border-radius:14px;padding:11px 14px;margin-top:6px;box-shadow:inset 5px 0 0 #2f9a6a}
.sp-fr b{font-size:1.4rem}.sp-fr span{grid-column:1;font-size:1.2rem;color:#8a8986}.sp-fr em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:1.15rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#e5f2ea;color:#2f7a4d}
.sp-fr.pend{box-shadow:inset 5px 0 0 #e0a03a}.sp-fr.pend em{background:#fbeee2;color:#b5662b}.sp-fr.gris{opacity:.6;box-shadow:inset 5px 0 0 #c9c6c0}.sp-fr.gris em{background:#eeece8;color:#8a8986}
.sp-fgo{display:block!important;width:100%;margin-top:8px;border:0!important;background:none!important;color:#0f6e74!important;font-weight:700;font-size:1.35rem!important;padding:8px 4px!important;text-align:right!important}
@media (min-width:1000px){.sp-fi{align-items:center;justify-content:center}.sp-fi>div{max-width:560px;border-radius:22px}}
@media (min-width:640px){.sp-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){
  .sp-app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start;margin-top:8px}
  .sp-nav{position:sticky;top:16px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;border:1px solid var(--line);border-radius:18px;padding:18px 12px;box-shadow:none}
  .sp-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}.sp-brand img{width:84px;height:auto}
  .sp-nav [data-solo-pc]{display:flex}.sp-nav [data-solo-cel]{display:none}
  .sp-sep{display:block;font-size:1.1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a9a6a0;padding:14px 12px 4px}
  .sp-ni{flex:none;flex-direction:row;gap:12px;font-size:1.45rem;padding:10px 12px;color:var(--ink)}
  .sp-ni:hover{background:#F3F1EC}
  .sp-ni.on{background:#E3F1F1;color:#0f6e74}
  .sp-yo{display:block;margin-top:18px;padding:14px 8px 0;border-top:1px solid var(--line);font-size:1.15rem;color:#8a8986;word-break:break-all}
  .sp-yo button{display:block;margin-top:6px;border:0;background:none;padding:0;font:inherit;color:#0f6e74;text-decoration:underline;cursor:pointer}
  .sp-main{padding-bottom:30px}
  .sp-top{margin-top:0}
  /* la Agenda va dentro: su propio menú no se muestra */
  .sp-area .es-nav{display:none}
}
</style>
</head>
<body>
<header class="ap-top"></header>
<main>
<section class='storm-section color-scheme-1 gradient'>
  <div class='storm-wrap pn'><div id='st'><div class='pn-skel'></div><div class='pn-skel'></div></div></div>
</section>
<script src="/panel/panel.js?v=1"></script>
<script>
(()=>{
  const API = "https://script.google.com/macros/s/AKfycbyFZiJBhEoWR3-mekjXfea3O0BbDItazLHQRUkCpWOUZOwJ4612kgiGsg4ocWpGBgO3/exec";
  const KEY = 'storm-panel';
  const root = document.getElementById('st');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const guardar = s => { try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_){} };
  const leer = () => { try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(_){ return null; } };
  const borrar = () => { try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY + '-datos'); localStorage.removeItem('storm-agenda-datos'); }catch(_){} };
  let auth = leer(), area = (() => { try{ return sessionStorage.getItem('storm-area') || 'hoy'; }catch(_){ return 'hoy'; } })();
  const sv = d => `<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'>${d}</svg>`;
  const I = {
    hoy: sv("<circle cx='12' cy='12' r='4'/><path d='M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4'/>"),
    particulares: sv("<path d='M6.5 20.5c3-1 9-7 11-14.5.3-1.2-.8-2.3-2-2C8 6 2 12 1 15c-.4 1.1.5 2 1.5 2.5'/><path d='M8 14l2 2'/><path d='M3 21h18'/>"),
    anual: sv("<rect x='3.5' y='5' width='17' height='15' rx='3'/><path d='M3.5 10h17M8 3v4M16 3v4M9 14.5h2M13 14.5h2M9 17h2'/>"),
    verano: sv("<path d='M2 17c2.5 0 2.5-1.5 5-1.5S9.5 17 12 17s2.5-1.5 5-1.5 2.5 1.5 5 1.5M2 21c2.5 0 2.5-1.5 5-1.5S9.5 21 12 21s2.5-1.5 5-1.5 2.5 1.5 5 1.5'/><circle cx='12' cy='8' r='3.5'/><path d='M12 1.5v1M5.5 8h1M17.5 8h1M7.4 3.4l.7.7M15.9 4.1l.7-.7'/>"),
    adultos: sv("<circle cx='9' cy='8' r='3.2'/><path d='M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/><circle cx='17' cy='9' r='2.5'/><path d='M16 14.2c2.8-.4 5 1.8 5 4.8'/>"),
    finanzas: sv("<path d='M4 20V10M10 20V4M16 20v-7M22 20H2'/>"),
    mas: sv("<circle cx='5' cy='12' r='1.6'/><circle cx='12' cy='12' r='1.6'/><circle cx='19' cy='12' r='1.6'/>"),
    pago: sv("<rect x='3' y='6' width='18' height='13' rx='3'/><path d='M3 10h18'/>"),
    ficha: sv("<rect x='5' y='3.5' width='14' height='17' rx='2.5'/><path d='M9 9h6M9 13h6M9 17h3'/>"),
    tel: sv("<path d='M5 3.5h3.2l1.6 4-2 1.3a11 11 0 0 0 5.4 5.4l1.3-2 4 1.6V17a3 3 0 0 1-3 3A14.5 14.5 0 0 1 2 6.5a3 3 0 0 1 3-3Z'/>"),
    lupa: sv("<circle cx='11' cy='11' r='6.5'/><path d='m20 20-4-4'/>"),
    grupo: sv("<circle cx='9' cy='8' r='3.2'/><path d='M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/><path d='M17 11v6M14 14h6'/>")
  };
  const TIT = { hoy: 'Hoy en Storm', particulares: 'Clases particulares', anual: 'Academia Anual', verano: 'Academia de Verano', adultos: 'Academia de Adultos', finanzas: 'Finanzas' };

  async function post(body){
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || 'Error');
    return d;
  }
  function login(email, err, paso){
    root.innerHTML = `<div class='pn-login'>
      <img src='/img/storm-logo.png' alt='Storm' style='width:150px;height:auto;display:block;margin:10px auto 14px'>
      ${paso==='codigo'
        ? `<p>Te enviamos un código a <b>${esc(email)}</b>.</p>
           <input class='pn-in pn-in--code' id='pn-code' inputmode='numeric' autocomplete='one-time-code' maxlength='6' placeholder='······'>
           <button class='pn-go' id='pn-ok'>Entrar</button>
           <p class='pn-note'><button class='pn-link' id='pn-back'>Usar otro correo</button></p>`
        : `<p>Solo para el equipo Storm. Entra con tu correo y te mandamos un código.</p>
           <input class='pn-in' id='pn-email' type='email' autocomplete='email' placeholder='tu@correo.cl' value='${esc(email||'')}'>
           <button class='pn-go' id='pn-ok'>Recibir código</button>`}
      ${err ? `<div class='pn-msg'>${esc(err)}</div>` : ''}
    </div>`;
    const ok = document.getElementById('pn-ok');
    const input = document.getElementById(paso==='codigo' ? 'pn-code' : 'pn-email');
    input.focus();
    input.addEventListener('keydown', e => { if(e.key==='Enter') ok.click(); });
    if(paso==='codigo'){
      document.getElementById('pn-back').onclick = () => login(email);
      input.addEventListener('input', () => { input.value = input.value.replace(/\D/g,''); if(input.value.length===6) ok.click(); });
      ok.onclick = async () => {
        ok.disabled = true; ok.textContent = 'Entrando…';
        try{ const s = await post({accion:'entrar', email, codigo:input.value}); auth = {email:s.email, ts:s.ts, firma:s.firma}; guardar(auth); abrir(); }
        catch(x){ login(email, x.message, 'codigo'); }
      };
    } else {
      ok.onclick = async () => {
        const e = input.value.trim().toLowerCase();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return login(e, 'Revisa el correo.');
        ok.disabled = true; ok.textContent = 'Enviando…';
        try{ await post({accion:'pedir-codigo', email:e}); login(e, '', 'codigo'); }
        catch(x){ login(e, x.message); }
      };
    }
  }
  const salir = msg => { const e = auth && auth.email; borrar(); auth = null; login(e, msg); };

  // ¿quién es? (lo dicen los datos de la Agenda o del Panel)
  const esAdmin = () => { const E = StormEscuela.datos(); if(E) return E.rol === 'admin'; const d = StormPanel.datos(); return d ? d.rol !== 'instructor' : true; };

  function items(){
    const adm = esAdmin();
    return [
      ['hoy', 'Hoy', 1], ['particulares', adm ? 'Particulares' : 'Mis particulares', 1], ['anual', 'Anual', 1], ['verano', 'Verano', 1],
      ['adultos', 'Adultos', 0], adm ? ['finanzas', 'Finanzas', 0] : null
    ].filter(Boolean);
  }
  function nav(){
    const it = items();
    return `<nav class='sp-nav'><div class='sp-brand'><img src='/img/storm-logo.png' alt='Storm'></div>
      ${it.map(([k, t, cel], n) => `${n === 1 ? `<div class='sp-sep'>Clases</div>` : n === 2 ? `<div class='sp-sep'>Academias</div>` : n === 5 ? `<div class='sp-sep'>Administración</div>` : ''}<button class='sp-ni' data-area='${k}'${cel ? '' : ' data-solo-pc'}>${I[k]}<span>${t}</span></button>`).join('')}
      <button class='sp-ni' data-mas data-solo-cel>${I.mas}<span>Más</span></button>
      <div class='sp-yo'>${esc(auth.email)}<button data-salir>Salir</button></div></nav>`;
  }

  function abrir(){
    if(!auth) return login();
    root.innerHTML = `<div class='sp-app'>${nav()}<div class='sp-main'>

  }
  function bindNav(){

    document.body.appendChild(w);

  function ir(a){

    root.querySelector('.sp-top h1').textContent = TIT[a];
    root.querySelector('.sp-top p').textContent = a === 'hoy' ? hoyLargo() : '';

  }
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const hoyLargo = () => { const d = new Date(); return DIAS[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };

  function pintarHoy(){
    const el = root.querySelector('[data-a="hoy"]'); if(!el) return;
    const E = StormEscuela.datos(), P = StormPanel.datos(), V = StormPanel.verano(), adm = esAdmin();
    if(!E && !P){ el.innerHTML = `<div class='pn-skel'></div><div class='pn-skel'></div>`; return; }

    acadHoy.forEach(c => lineas.push({ h: String(c.horario || '').slice(0, 5), html: `<button class='sp-line anual${c.cancelada ? ' cancel' : ''}' data-go='anual:clases'><span class='h'>${esc(String(c.horario || '').replace(/\s*hrs?\.?$/i, ''))}</span><span><b>${esc(c.clase)}</b><small>${c.cancelada ? 'Cancelada' : (c.van || 0) + ' alumnos'}</small></span><span class='tag'>Anual</span></button>` }));

    const man = E ? part.filter(r => r.fecha === sumar(hoyF, 1)) : [];
    const acadMan = P ? (P.clases || []).filter(c => c.cuando === 'Mañana') : [];

      h += `<p class='sp-h3'>Mañana</p>` + man.map(r => `<button class='sp-line' data-go='particulares:dia'><span class='h'>${esc(r.hora)}</span><span><b>${esc(r.nombre)}</b><small>${r.personas} persona${r.personas === 1 ? '' : 's'} · ${r.instructores.map(esc).join(' y ')}</small></span><span class='tag'>Particular</span></button>`).join('')

      ir(a);
      if(a === 'particulares' && s) StormEscuela.ir(s);
      if(a === 'anual' && s) setTimeout(() => StormPanel.tab(s), 50);
    });
  }
  // ---------- buscador: una persona, todas las áreas ----------
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function personas(){
    const out = [], ya = {};
    const add = (n, tipo, sub, go, tel) => { const k = norm(n) + '|' + tipo; if(!n || ya[k]) return; ya[k] = 1; out.push({ n, tipo, sub, go, tel }); };

    if(E) E.reservas.slice().reverse().forEach(r => add(r.nombre, 'Particular', (r.fecha >= E.hoy ? 'Próxima clase ' : 'Última clase ') + r.fecha.split('-').reverse().slice(0, 2).join('/') + ' ' + r.hora, 'particulares:reservas', r.telefono));
    if(P){
      (P.clases || []).forEach(c => (c.alumnos || []).forEach(a => add(a.nombre, 'Anual', a.grupo || '', 'anual:alumnos')));
      ((P.actual || {}).faltan || []).forEach(f => { f.alumnos.forEach(a => add(a, 'Anual', 'Falta pagar este mes', 'anual:pagos', f.telefono)); if(f.apoderado) add(f.apoderado, 'Apoderado', 'de ' + f.alumnos.join(' y '), 'anual:pagos', f.telefono); });
      ((P.actual || {}).pagaron || []).forEach(x => add(x.alumno, 'Anual', 'Plan ' + (x.plan || '') + (x.grupo ? ' · ' + x.grupo : ''), 'anual:alumnos'));
    }
    return out;
  }
  function buscador(){
    const q = root.querySelector('#sp-q'), res = root.querySelector('.sp-res'); if(!q) return;
    const pintar = () => {
      const t = norm(q.value.trim()); if(t.length < 2){ res.hidden = true; return; }

      res.hidden = false;
      res.innerHTML = l.length ? l.map((x, i) => { let k = 0; for(const ch of x.n) k = (k * 31 + ch.charCodeAt(0)) % 997;
        return `<div class='sp-ri'><button data-ri='${i}'><span class='sp-av' style='background:${COL[k % COL.length]}'>${esc(x.n.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span><span><b>${esc(x.n)}</b><small>${esc(x.sub)}</small></span><em class='${x.tipo === 'Particular' ? '' : 'a'}'>${x.tipo}</em></button>${wa(x.tel) ? `<a class='sp-wa' href='https://wa.me/${wa(x.tel)}' target='_blank' rel='noopener' aria-label='WhatsApp'>${WA}</a>` : ''}</div>`; }).join('')
        : `<p class='sp-nada'>No encontré a nadie con ese nombre.</p>`;
      res.querySelectorAll('[data-ri]').forEach(b => b.onclick = () => {

  }
  // ---------- ficha de una persona: todo lo de ella en un lugar ----------
  const clpS = n => '$' + Math.round(n || 0).toLocaleString('es-CL');
  function ficha(x){
    const E = StormEscuela.datos(), P = StormPanel.datos(), n = norm(x.n), adm = esAdmin();
    const mismas = E ? E.reservas.filter(r => norm(r.nombre) === n || (x.tel && wa(r.telefono) === wa(x.tel))) : [];
    const anual = [];

      const g = {}; (P.clases || []).forEach(c => (c.alumnos || []).forEach(a => { if(norm(a.nombre) === n) g.grupo = a.grupo; }));

    }

    const k = [...x.n].reduce((k, ch) => (k * 31 + ch.charCodeAt(0)) % 997, 0);
    const est = r => r.estado === 'cancelada' ? ['gris', 'Cancelada'] : r.estado === 'pendiente' || r.medio === 'Por pagar' ? ['pend', 'Falta pagar'] : ['ok', 'Pagada'];

      ${anual.map(a => `<p class='sp-h3'>Academia Anual</p><div class='sp-fb anual'>${a.hijos ? `<div><small>Apoderado de</small><b>${a.hijos.map(esc).join(', ')}</b></div>` : ''}${a.grupo ? `<div><small>Grupo</small><b>${esc(a.grupo)}</b></div>` : ''}${a.plan ? `<div><small>Plan</small><b>${esc(a.plan)}</b></div>` : ''}${a.pago ? `<div><small>Este mes</small><b class='${a.debe ? 'pend' : 'ok'}'>${a.debe ? '● ' : '✓ '}${esc(a.pago)}</b></div>` : ''}</div><button class='sp-fgo' data-fgo='anual:${a.debe ? 'pagos' : 'alumnos'}'>Ver en Academia Anual ›</button>`).join('')}

  const wa = t => { let n = String(t || '').replace(/\D/g, ''); if(n.length === 9 && n[0] === '9') n = '56' + n; if(n.length === 8) n = '569' + n; return n.length >= 10 ? n : ''; };
  const COL = ['#0f6e74', '#2d6e94', '#b5662b', '#7a5a9e', '#2f7a4d', '#a6402c', '#5b6b7a', '#9a7b1f'];
  const WA = `<svg viewBox='0 0 24 24' fill='currentColor'><path d='M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.2 21.8l5.1-1.3A9.7 9.7 0 1 0 12 2.2Zm0 17.7c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9Zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1l-.4-.2Z'/></svg>`;
  function realzar(el){
    el.querySelectorAll('.pn-chip:not([data-av])').forEach(c => {
      c.dataset.av = 1; const t = c.textContent.replace(/[↪\s]+/, ' ').trim(); if(!t) return;

    });
    el.querySelectorAll('.pn-wa:not([data-ic])').forEach(a => { a.dataset.ic = 1; a.title = a.title || 'WhatsApp'; a.setAttribute('aria-label', 'WhatsApp'); a.innerHTML = WA; });
  }
  const sumar = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  abrir();
})();

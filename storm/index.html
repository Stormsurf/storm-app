<style>
.pn-go{background:#0f6e74}.pn-in:focus{border-color:#0f6e74}
.ap-top{display:none}
main .pn{max-width:1440px}
/* plataforma: barra abajo en el celular, menú a la izquierda en el computador */
.sp-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.04)}
.sp-brand,.sp-yo,.sp-sep,.sp-nav [data-solo-pc]{display:none}
.sp-ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font:inherit;font-size:1.05rem;font-weight:600;color:#8a8986;padding:6px 2px;cursor:pointer;border-radius:12px;min-width:0}
.sp-ni span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp-ni svg{width:24px;height:24px}
.sp-ni.on{color:#0f6e74}
.sp-main{padding-bottom:100px;min-width:0}
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.sp-top h1{margin:0;font-size:2.4rem;font-weight:600;line-height:1.15}
.sp-top p{margin:2px 0 0;font-size:1.3rem;color:#8a8986}
.sp-area[hidden]{display:none}
.sp-panel{max-width:900px}
.sp-panel .pn-sw{display:none}
.sp-mas{--line:rgba(44,44,43,.12);--ink:#2C2C2B;color:var(--ink);position:fixed;inset:0;z-index:40;background:rgba(30,30,28,.45);display:flex;align-items:flex-end}
.sp-mas>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.sp-mas button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;font:inherit;font-size:1.6rem;padding:14px 8px;color:var(--ink);border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.sp-mas button:last-child{border-bottom:0}
.sp-mas svg{width:26px;height:26px;color:#0f6e74}
.sp-mas small{display:block;font-size:1.2rem;color:#8a8986}
/* Hoy */
.sp-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sp-tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.sp-tile i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#E3F1F1;color:#0f6e74;margin-bottom:4px}.sp-tile i svg{width:22px;height:22px}
.sp-tile b{font-size:2.6rem;line-height:1}.sp-tile span{font-size:1.3rem;color:#55544f}.sp-tile small{font-size:1.15rem;color:#8a8986}
.sp-tile.warn i{background:#fbeee2;color:#b5662b}.sp-tile.ok i{background:#e5f2ea;color:#2f7a4d}
.sp-h3{font-size:1.25rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0f6e74;margin:22px 0 8px}
.sp-line{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid #0f6e74;border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;width:100%;font:inherit;text-align:left;color:var(--ink)}
.sp-line .h{font-size:1.7rem;font-weight:700;min-width:58px}
.sp-line b{display:block;font-size:1.45rem;font-weight:600}.sp-line small{display:block;font-size:1.2rem;color:#8a8986}
.sp-line .tag{margin-left:auto;flex:none;border-radius:999px;padding:3px 10px;font-size:1.1rem;font-weight:700;background:#E3F1F1;color:#0f6e74}
.sp-line.anual{border-left-color:#61A1C8}.sp-line.anual .tag{background:#E6F1F8;color:#2d6e94}
.sp-line.verano{border-left-color:#e0b43a}.sp-line.verano .tag{background:#FFF4CC;color:#7a5a00}
.sp-line.cancel{opacity:.55}
.sp-vacio{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:#8a8986;font-size:1.35rem;margin-top:8px}
.sp-pronto{background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line)}
.sp-pronto h3{margin:0 0 6px}.sp-pronto p{margin:0;font-size:1.4rem;color:#55544f;line-height:1.5}
/* Anual / Verano / Finanzas con el mismo diseño de la plataforma (cada academia mantiene su color) */
.sp-panel .pn-tabs{gap:6px;margin:16px 0 4px;padding:0}
.sp-panel .pn-tab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:1.35rem;font-weight:600}
.sp-panel .pn-tab.on{background:var(--aa);border-color:var(--aa);color:#fff}
.sp-panel .pn-tab i{background:#e0a03a}
.sp-panel .pn-stats{gap:10px;margin-top:4px}
.sp-panel .pn-stat{border-radius:18px;padding:14px 16px}
.sp-panel .pn-stat--warn{background:#fff;box-shadow:inset 5px 0 0 #e0a03a}
.sp-panel .pn-stat--warn b{color:#b5662b}
.sp-panel .pn-card{border-radius:18px;box-shadow:inset 5px 0 0 var(--aa)}
.sp-panel .pn-cancel{box-shadow:inset 5px 0 0 #c9c6c0;opacity:.7}
.sp-panel .pn-chips{display:flex;flex-wrap:wrap;gap:6px}
.sp-panel .pn-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;background:#fff;border:1px solid var(--line)}
.sp-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:#fff;flex:none}
.sp-panel .pn-wa{width:44px;height:44px;padding:0;justify-content:center;font-size:0;border-radius:50%}
.sp-panel .pn-wa svg{width:22px;height:22px}
.sp-panel .pn-paid{background:#2f9a6a;border-color:#2f9a6a;color:#fff;padding:9px 14px}
.sp-panel .pn-row{gap:10px}
.sp-panel .pn-verano{--aa:#e0b43a;--aa-dk:#7a5a00;--aa-soft:#FFF4CC}
.sp-panel .pn-verano .pn-tab.on,.sp-panel .pn-verano .pn-gbtn.on{color:#3B2610}
.sp-panel .pn-finz{--aa:#2C2C2B;--aa-dk:#2C2C2B;--aa-soft:#eeece8}
.sp-panel .pn-fsub{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sp-panel .pn-fsub button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:1.35rem;font-weight:600;cursor:pointer;color:var(--ink)}
.sp-panel .pn-fsub button.on{background:#0f6e74;border-color:#0f6e74;color:#fff}
.sp-top{flex-wrap:wrap}
.sp-bus{position:relative;flex:1 1 100%;order:2}
.sp-top>div:first-child{flex:1;min-width:0}
.sp-bus>span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a8986;display:flex}.sp-bus>span svg{width:20px;height:20px}
.sp-bus input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 14px 11px 42px;font:inherit;font-size:1.45rem;color:var(--ink)}
.sp-bus input:focus{outline:none;border-color:#0f6e74}
.sp-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:35;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:6px;max-height:60vh;overflow:auto}
.sp-ri{display:flex;align-items:center;gap:6px}
.sp-ri button{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;font:inherit;text-align:left;padding:9px 8px;border-radius:12px;cursor:pointer;color:var(--ink);min-width:0}
.sp-ri button:hover{background:#F3F1EC}
.sp-ri .sp-av{width:36px;height:36px;font-size:1.25rem}
.sp-ri b{display:block;font-size:1.45rem;font-weight:600}.sp-ri small{display:block;font-size:1.2rem;color:#8a8986}
.sp-ri em{margin-left:auto;flex:none;font-style:normal;font-size:1.1rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#E3F1F1;color:#0f6e74}.sp-ri em.a{background:#E6F1F8;color:#2d6e94}
.sp-wa{flex:none;width:38px;height:38px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center}.sp-wa svg{width:20px;height:20px}
.sp-tap,.sp-panel .pn-alb{cursor:pointer}.sp-panel .pn-alb:hover{text-decoration:underline}
@media (max-width:999px){.sp-nav--recep{display:none}}
.sp-panel .pn-card{box-shadow:none;border:1px solid #e3e0da;border-radius:18px;padding:18px}
.sp-panel .pn-card h3{font-size:1.7rem;font-weight:600}
.sp-panel .pn-cancel{box-shadow:none;opacity:.6}
.sp-panel .pn-stat{border:1px solid #e3e0da}.sp-panel .pn-stat--main{border:0}
.sp-panel .pn-stat--warn{box-shadow:none;border-color:#f0d3a8}
.sp-av2{width:44px;height:44px;font-size:1.45rem}
.sp-panel .pn-al.sp-alr{flex-wrap:wrap;justify-content:flex-start;gap:14px;padding:12px 0;cursor:pointer}
.sp-panel .pn-al .sp-aln{flex:1;min-width:0}.sp-panel .pn-al .sp-aln b{font-size:1.6rem;font-weight:500}.sp-panel .pn-al .sp-aln small{font-size:1.35rem!important}
.sp-panel .pn-al .sp-alacc{display:none}
.sp-panel .pn-al>:not(.sp-av):not(.sp-aln):not(.sp-chev):not(.sp-alacc){flex-basis:100%}
.sp-chev{color:#a5a39f;font-size:2.2rem;line-height:1}
.sp-panel .pn-al:hover .sp-aln b{text-decoration:none}.sp-panel .pn-alb:hover{text-decoration:none}
.sp-panel [data-pane='pagos'] .pn-row{align-items:center;gap:14px;padding:12px 0}
.sp-panel [data-pane='pagos'] .pn-row>div:not(.pn-acts){flex:1;min-width:0}
.sp-panel .pn-row b{font-weight:500;font-size:1.55rem}
.sp-panel .pn-amt{font-weight:700;font-size:1.6rem}
.sp-panel .pn-tabs{margin-top:18px}
.sp-panel .pn-tab{padding:9px 15px;font-size:1.4rem}
.sp-panel .pn-nt{border-radius:999px;padding:12px 18px;font-size:1.45rem}
.sp-panel .pn-ntgo{background:#0f6e74;border-radius:999px;padding:12px 20px;font-size:1.5rem}
.sp-panel .pn-gbox input,.sp-panel textarea,.sp-panel .pn-card input:not([type=checkbox]){min-height:48px;border-radius:12px;border:1px solid #d9d6d0;font-size:1.5rem;box-sizing:border-box}
.sp-panel textarea{min-height:90px}
.sp-nada{margin:10px;color:#8a8986;font-size:1.35rem}
@media (min-width:1000px){.sp-bus{flex:0 1 360px;order:0}}
.sp-fi>div{position:relative;max-height:88vh;overflow:auto;background:#EFECE8;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sp-fx{position:absolute;right:12px;top:12px;width:38px!important;height:38px;border-radius:50%!important;background:#fff!important;justify-content:center;padding:0!important;font-size:1.5rem!important;border:0!important;color:#555!important}
.sp-fh{display:flex;align-items:center;gap:14px;margin-bottom:14px}.sp-fh .sp-av{width:58px;height:58px;font-size:2rem}
.sp-fh h2{margin:0;font-size:2.2rem;font-weight:600;line-height:1.15}.sp-fh p{margin:2px 0 0;color:#8a8986;font-size:1.3rem}
.sp-fc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp-fc a{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;background:#fff;color:#0f6e74;text-decoration:none;font-weight:700;font-size:1.4rem;border:1px solid var(--line)}
.sp-fc a.w{background:#25D366;color:#fff;border-color:#25D366}.sp-fc svg{width:22px;height:22px}
.sp-fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;border-radius:16px;padding:14px;box-shadow:inset 5px 0 0 #61A1C8}
.sp-fb small{display:block;font-size:1.15rem;color:#8a8986}.sp-fb b{font-size:1.45rem;font-weight:600}.sp-fb b.pend{color:#b5662b}.sp-fb b.ok{color:#2f7a4d}
.sp-fr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fff;border-radius:14px;padding:11px 14px;margin-top:6px;box-shadow:inset 5px 0 0 #2f9a6a}
.sp-fr b{font-size:1.4rem}.sp-fr span{grid-column:1;font-size:1.2rem;color:#8a8986}.sp-fr em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:1.15rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#e5f2ea;color:#2f7a4d}
.sp-fr.pend{box-shadow:inset 5px 0 0 #e0a03a}.sp-fr.pend em{background:#fbeee2;color:#b5662b}.sp-fr.gris{opacity:.6;box-shadow:inset 5px 0 0 #c9c6c0}.sp-fr.gris em{background:#eeece8;color:#8a8986}
.sp-fgo{display:block!important;width:100%;margin-top:8px;border:0!important;background:none!important;color:#0f6e74!important;font-weight:700;font-size:1.35rem!important;padding:8px 4px!important;text-align:right!important}
@media (min-width:1000px){.sp-fi{align-items:center;justify-content:center}.sp-fi>div{max-width:560px;border-radius:22px}}
.sp-panel .pn-finz .pn-stat--main{background:#2f9a6a}.sp-panel .pn-finz .pn-stat--main.pn-fneg{background:#c0503a}
.sp-panel .pn-fbar{height:14px;margin-top:7px}.sp-panel .pn-fbar i.in{background:#2f9a6a}.sp-panel .pn-fbar i.out{background:#e0a03a}
.sp-panel .pn-farea{padding:14px 0}.sp-panel .pn-fah{font-size:1.55rem}
.sp-panel .pn-farea small{opacity:.75}
.sp-panel .pn-fsub,.sp-panel .pn-fadd{display:none!important}
.sp-yo-cel{width:40px;height:40px;border-radius:50%;border:0;background:#0f6e74;color:#fff;font:inherit;font-weight:700;font-size:1.5rem;cursor:pointer;flex:none}
.sp-plus{flex:none;align-self:center;width:58px;height:58px;margin:-22px 4px 0;border-radius:50%;border:0;background:#0f6e74;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(15,110,116,.4);cursor:pointer}
.sp-plus svg{width:28px;height:28px;stroke-width:2.4}
.sp-mas-pc{display:none}
.sp-seg{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:999px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.sp-seg[hidden]{display:none}
.sp-seg button{flex:1 0 auto;border:0;background:none;border-radius:999px;padding:10px 14px;font:inherit;font-size:1.4rem;font-weight:600;color:var(--ink);cursor:pointer}
.sp-seg button.on{background:#0f6e74;color:#fff}
.sp-pe{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px;font:inherit;text-align:left;color:var(--ink);cursor:pointer}
.sp-pe i{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#E3F1F1;color:#0f6e74}.sp-pe i svg{width:22px;height:22px}
.sp-pe.warn i{background:#fbeee2;color:#b5662b}
.sp-pe b{display:block;font-size:1.5rem;font-weight:600}.sp-pe small{display:block;font-size:1.2rem;color:#8a8986;margin-top:1px}
.sp-pe em{margin-left:auto;color:#c9c6c0;display:flex}.sp-pe em svg{width:20px;height:20px}
.sp-todo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.sp-todo i{width:52px;height:52px;border-radius:50%;background:#2f9a6a;color:#fff;display:grid;place-items:center;margin-bottom:6px}.sp-todo i svg{width:28px;height:28px;stroke-width:2.6}
.sp-todo b{font-size:1.8rem}.sp-todo span{font-size:1.35rem;color:#8a8986}
/* anotar */
.sp-an>div{position:relative;background:#fff;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sp-an button{display:inline-flex;width:auto;border-bottom:0;padding:0;font-size:inherit}
.an-h{margin:0 0 10px;font-size:2rem;font-weight:600}
.an-monto{display:flex;align-items:center;gap:6px;border-bottom:2px solid #0f6e74;padding:4px 2px;margin-bottom:6px}
.an-monto span{font-size:3.2rem;font-weight:600;color:#8a8986}
.an-monto input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:3.6rem;font-weight:700;color:var(--ink);background:none;padding:0}
.an-q{margin:16px 0 8px;font-size:1.25rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a8986}
.an-chips{display:flex;flex-wrap:wrap;gap:8px}
.sp-an .an-chips button{border:1.5px solid var(--line)!important;background:#fff;border-radius:999px;padding:9px 14px!important;font-size:1.4rem!important;font-weight:600;color:var(--ink)}
.sp-an .an-chips button.on{background:#0f6e74;border-color:#0f6e74!important;color:#fff}
.an-det{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:1.45rem}
.an-areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sp-an .an-areas button{display:flex;flex-direction:column;align-items:center;gap:5px;border:1.5px solid var(--line)!important;background:#fff;border-radius:14px;padding:10px 4px!important;font-size:1.15rem!important;font-weight:600;color:var(--ink)}
.sp-an .an-areas button svg{width:24px;height:24px;color:#0f6e74}
.sp-an .an-areas button.on{background:#E3F1F1;border-color:#0f6e74!important;color:#0f6e74}
.sp-an .an-go{display:block;width:100%;margin-top:18px;border-radius:999px;background:#0f6e74;color:#fff;font-weight:700;font-size:1.6rem!important;padding:15px!important;text-align:center}
.sp-an .an-go[disabled]{opacity:.6}
.an-err{margin:8px 0 0;color:#a6402c;font-size:1.3rem;text-align:center;min-height:1em}
.an-otros{display:flex;justify-content:center;gap:18px;margin-top:6px}
.sp-an .an-otros button{background:none;color:#0f6e74;text-decoration:underline;font-size:1.3rem!important}
@media (min-width:1000px){
  .sp-an{align-items:center;justify-content:center}.sp-an>div{max-width:520px;border-radius:22px}
  .sp-plus,.sp-yo-cel{display:none}
  .sp-mas-pc{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 14px;border:0;border-radius:999px;background:#0f6e74;color:#fff;font:inherit;font-weight:700;font-size:1.5rem;padding:12px;cursor:pointer}
  .sp-mas-pc svg{width:20px;height:20px;stroke-width:2.4}
  .sp-seg{display:inline-flex;max-width:100%}
  .sp-seg button{flex:none}
}
@media (min-width:640px){.sp-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){
  .sp-app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start;margin-top:8px}
  .sp-nav{position:sticky;top:16px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;border:1px solid var(--line);border-radius:18px;padding:18px 12px;box-shadow:none}
  .sp-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}.sp-brand img{width:84px;height:auto}
  .sp-nav [data-solo-pc]{display:flex}.sp-nav [data-solo-cel]{display:none}
  .sp-sep{display:block;font-size:1.1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a9a6a0;padding:14px 12px 4px}
  .sp-ni{flex:none;flex-direction:row;gap:12px;font-size:1.45rem;padding:10px 12px;color:var(--ink)}
  .sp-ni:hover{background:#F3F1EC}
  .sp-ni.on{background:#E3F1F1;color:#0f6e74}
  .sp-yo{display:block;margin-top:18px;padding:14px 8px 0;border-top:1px solid var(--line);font-size:1.15rem;color:#8a8986;word-break:break-all}
  .sp-yo button{display:block;margin-top:6px;border:0;background:none;padding:0;font:inherit;color:#0f6e74;text-decoration:underline;cursor:pointer}
  .sp-main{padding-bottom:30px}
  .sp-top{margin-top:0}
  /* la Agenda va dentro: su propio menú no se muestra */
  .sp-area .es-nav{display:none}
}
</style>
</head>
<body>
<header class="ap-top"></header>
<main>
<section class='storm-section color-scheme-1 gradient'>
  <div class='storm-wrap pn'><div id='st'><div class='pn-skel'></div><div class='pn-skel'></div></div></div>
</section>
<script src="/panel/panel.js?v=6"></script>
<script>
(()=>{
  const API = "https://script.google.com/macros/s/AKfycbyFZiJBhEoWR3-mekjXfea3O0BbDItazLHQRUkCpWOUZOwJ4612kgiGsg4ocWpGBgO3/exec";
  const KEY = 'storm-panel';
  const root = document.getElementById('st');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const guardar = s => { try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_){} };
  const leer = () => { try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(_){ return null; } };
  const borrar = () => { try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY + '-datos'); localStorage.removeItem('storm-agenda-datos'); }catch(_){} };
  let auth = leer(), area = (() => { try{ return sessionStorage.getItem('storm-area') || 'hoy'; }catch(_){ return 'hoy'; } })();
  const sv = d => `<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'>${d}</svg>`;
  const I = {
    hoy: sv("<circle cx='12' cy='12' r='4'/><path d='M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4'/>"),
    particulares: sv("<path d='M6.5 20.5c3-1 9-7 11-14.5.3-1.2-.8-2.3-2-2C8 6 2 12 1 15c-.4 1.1.5 2 1.5 2.5'/><path d='M8 14l2 2'/><path d='M3 21h18'/>"),
    anual: sv("<rect x='3.5' y='5' width='17' height='15' rx='3'/><path d='M3.5 10h17M8 3v4M16 3v4M9 14.5h2M13 14.5h2M9 17h2'/>"),
    verano: sv("<path d='M2 17c2.5 0 2.5-1.5 5-1.5S9.5 17 12 17s2.5-1.5 5-1.5 2.5 1.5 5 1.5M2 21c2.5 0 2.5-1.5 5-1.5S9.5 21 12 21s2.5-1.5 5-1.5 2.5 1.5 5 1.5'/><circle cx='12' cy='8' r='3.5'/><path d='M12 1.5v1M5.5 8h1M17.5 8h1M7.4 3.4l.7.7M15.9 4.1l.7-.7'/>"),
    adultos: sv("<circle cx='9' cy='8' r='3.2'/><path d='M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/><circle cx='17' cy='9' r='2.5'/><path d='M16 14.2c2.8-.4 5 1.8 5 4.8'/>"),
    finanzas: sv("<path d='M4 20V10M10 20V4M16 20v-7M22 20H2'/>"),
    mas: sv("<circle cx='5' cy='12' r='1.6'/><circle cx='12' cy='12' r='1.6'/><circle cx='19' cy='12' r='1.6'/>"),
    pago: sv("<rect x='3' y='6' width='18' height='13' rx='3'/><path d='M3 10h18'/>"),
    ficha: sv("<rect x='5' y='3.5' width='14' height='17' rx='2.5'/><path d='M9 9h6M9 13h6M9 17h3'/>"),
    tel: sv("<path d='M5 3.5h3.2l1.6 4-2 1.3a11 11 0 0 0 5.4 5.4l1.3-2 4 1.6V17a3 3 0 0 1-3 3A14.5 14.5 0 0 1 2 6.5a3 3 0 0 1 3-3Z'/>"),
    mas2: sv("<path d='M12 5v14M5 12h14'/>"),
    tabla: sv("<path d='M12 2.5c3.5 3 4.5 9 3 14.5-.6 2.2-1.6 3.8-3 4.5-1.4-.7-2.4-2.3-3-4.5-1.5-5.5-.5-11.5 3-14.5Z'/><path d='M12 7v10'/>"),
    tienda: sv("<path d='M5 8h14l-1 12H6L5 8Z'/><path d='M9 8V6a3 3 0 0 1 6 0v2'/>"),
    casa: sv("<path d='M3.5 11 12 4l8.5 7'/><path d='M5.5 9.5V20h13V9.5'/><path d='M10 20v-5h4v5'/>"),
    flecha: sv("<path d='m9 6 6 6-6 6'/>"),
    ok: sv("<path d='m5 12.5 4.5 4.5L19 7.5'/>"),
    lupa: sv("<circle cx='11' cy='11' r='6.5'/><path d='m20 20-4-4'/>"),
    grupo: sv("<circle cx='9' cy='8' r='3.2'/><path d='M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6'/><path d='M17 11v6M14 14h6'/>")
  };
  const TIT = { hoy: 'Hoy en Storm', particulares: 'Clases particulares', anual: 'Academias', verano: 'Academias', adultos: 'Academias', finanzas: 'Plata', sueldos: 'Plata' };
  const GRUPO = { anual: 'academias', verano: 'academias', adultos: 'academias', finanzas: 'plata', sueldos: 'plata' };
  const SEG = { academias: [['anual', 'Anual'], ['verano', 'Verano'], ['adultos', 'Adultos']], plata: [['finanzas', 'Este mes'], ['sueldos', 'Sueldos'], ['particulares:pagos', 'Pagos particulares']] };
  let ultimo = (() => { try{ return JSON.parse(sessionStorage.getItem('storm-ultimo') || 'null') || {}; }catch(_){ return {}; } })();
  if(!ultimo.academias) ultimo.academias = [0, 1].includes(new Date().getMonth()) ? 'verano' : 'anual';
  if(!ultimo.plata) ultimo.plata = 'finanzas';

  async function post(body){
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || 'Error');
    return d;
  }
  function login(email, err, paso){
    root.innerHTML = `<div class='pn-login'>
      <img src='/img/storm-logo.png' alt='Storm' style='width:150px;height:auto;display:block;margin:10px auto 14px'>
      ${paso==='codigo'
        ? `<p>Te enviamos un código a <b>${esc(email)}</b>.</p>
           <input class='pn-in pn-in--code' id='pn-code' inputmode='numeric' autocomplete='one-time-code' maxlength='6' placeholder='······'>
           <button class='pn-go' id='pn-ok'>Entrar</button>
           <p class='pn-note'><button class='pn-link' id='pn-back'>Usar otro correo</button></p>`
        : `<p>Solo para el equipo Storm. Entra con tu correo y te mandamos un código.</p>
           <input class='pn-in' id='pn-email' type='email' autocomplete='email' placeholder='tu@correo.cl' value='${esc(email||'')}'>
           <button class='pn-go' id='pn-ok'>Recibir código</button>`}
      ${err ? `<div class='pn-msg'>${esc(err)}</div>` : ''}
    </div>`;
    const ok = document.getElementById('pn-ok');
    const input = document.getElementById(paso==='codigo' ? 'pn-code' : 'pn-email');
    input.focus();
    input.addEventListener('keydown', e => { if(e.key==='Enter') ok.click(); });
    if(paso==='codigo'){
      document.getElementById('pn-back').onclick = () => login(email);
      input.addEventListener('input', () => { input.value = input.value.replace(/\D/g,''); if(input.value.length===6) ok.click(); });
      ok.onclick = async () => {
        ok.disabled = true; ok.textContent = 'Entrando…';
        try{ const s = await post({accion:'entrar', email, codigo:input.value}); auth = {email:s.email, ts:s.ts, firma:s.firma}; guardar(auth); abrir(); }
        catch(x){ login(email, x.message, 'codigo'); }
      };
    } else {
      ok.onclick = async () => {
        const e = input.value.trim().toLowerCase();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return login(e, 'Revisa el correo.');
        ok.disabled = true; ok.textContent = 'Enviando…';
        try{ await post({accion:'pedir-codigo', email:e}); login(e, '', 'codigo'); }
        catch(x){ login(e, x.message); }
      };
    }
  }
  const salir = msg => { const e = auth && auth.email; borrar(); auth = null; login(e, msg); };

  // ¿quién es? (lo dicen los datos de la Agenda o del Panel)
  const esAdmin = () => { const E = StormEscuela.datos(); if(E) return E.rol === 'admin'; const d = StormPanel.datos(); return d ? d.rol !== 'instructor' : true; };

  const esRecep = () => (StormEscuela.datos() || {}).rol === 'recepcion';
  function nav(){
    const adm = esAdmin(), ac = '<div class="sp-sep">';
    if(esRecep()) return `<nav class='sp-nav sp-nav--recep'><div class='sp-brand'><img src='/img/storm-logo.png' alt='Storm'></div><button class='sp-ni' data-area='particulares'>${I.particulares}<span>Agenda</span></button><div class='sp-yo'>${esc(auth.email)}<button data-salir>Salir</button></div></nav>`;
    const b = (k, t, ico, extra) => `<button class='sp-ni' data-area='${k}'${extra || ''}>${ico}<span>${t}</span></button>`;
    return `<nav class='sp-nav'><div class='sp-brand'><img src='/img/storm-logo.png' alt='Storm'></div>
      ${adm ? `<button class='sp-mas-pc' data-anotar>${I.mas2}<span>Anotar</span></button>` : ''}
      ${b('hoy', 'Hoy', I.hoy)}
      ${b('particulares', adm ? 'Clases' : 'Mis clases', I.particulares)}
      ${adm ? `<button class='sp-plus' data-anotar aria-label='Anotar'>${I.mas2}</button>` : ''}
      ${adm ? b('plata', 'Plata', I.finanzas, ' data-solo-cel') : ''}
      ${b('academias', 'Academias', I.anual, ' data-solo-cel')}
      ${ac}Academias</div>${b('anual', 'Academia Anual', I.anual, ' data-solo-pc')}${b('verano', 'Academia de Verano', I.verano, ' data-solo-pc')}${b('adultos', 'Academia de Adultos', I.adultos, ' data-solo-pc')}
      ${adm ? `${ac}Plata</div>${b('finanzas', 'Este mes', I.finanzas, ' data-solo-pc')}${b('sueldos', 'Sueldos', I.pago, ' data-solo-pc')}` : ''}
      <div class='sp-yo'>${esc(auth.email)}<button data-salir>Salir</button></div></nav>`;
  }

  function abrir(){
    if(!auth) return login();
    root.innerHTML = `<div class='sp-app'>${nav()}<div class='sp-main'>
      <div class='sp-top'><div><h1></h1><p></p></div><button class='sp-yo-cel' data-cuenta aria-label='Mi cuenta'>${esc((auth.email || '?')[0].toUpperCase())}</button><div class='sp-bus'><span>${I.lupa}</span><input id='sp-q' type='search' placeholder='Buscar alumno o cliente' autocomplete='off'><div class='sp-res' hidden></div></div></div>
      <div class='sp-seg' hidden></div>
      <div class='sp-area' data-a='hoy'></div>
      <div class='sp-area' data-a='particulares' hidden><div class='pn-escuela'></div></div>
      <div class='sp-area sp-panel' data-a='panel' hidden><div class='sp-pn'></div></div>
    </div></div>`;
    StormEscuela.cargar(root.querySelector('.pn-escuela'), auth, salir);
    const pn = root.querySelector('.sp-pn'); StormPanel.montar(pn, auth);
    pn.addEventListener('click', e => {
      if(!['anual'].includes(area)) return;
      let c = e.target.closest('.pn-chip[data-nombre], .pn-alb');
      if(!c){ const r = e.target.closest('.pn-al[data-alumno]'); if(!r || e.target.closest('button, input, textarea, select, a, label, .pn-nvbox, .pn-ntbox')) return; c = r; }
      const n = c.dataset.nombre || c.dataset.alumno || c.textContent.trim(); ficha({ n, tipo: 'Anual', sub: '', go: 'anual:alumnos' });
    });
    let rz = 0; new MutationObserver(() => { if(rz) return; rz = requestAnimationFrame(() => { rz = 0; realzar(pn); }); }).observe(pn, { childList: true, subtree: true });
    ir(area);
    buscador();
    // los datos llegan solos: refrescamos Hoy y el menú cuando cambian
    let firma = '';
    setInterval(() => {
      const f = JSON.stringify([!!StormEscuela.datos(), !!StormPanel.datos(), esAdmin(), (StormEscuela.datos() || {}).reservas && StormEscuela.datos().reservas.length]);
      if(f === firma) return; firma = f;
      const n = root.querySelector('.sp-nav'); if(n){ n.outerHTML = nav(); bindNav(); marcar(); }
      if(esRecep() && area !== 'particulares') ir('particulares');
      if(area === 'hoy') pintarHoy();
    }, 1200);
  }
  function bindNav(){
    root.querySelectorAll('.sp-nav [data-area]').forEach(b => b.onclick = () => ir(b.dataset.area));
    root.querySelectorAll('[data-salir]').forEach(b => b.onclick = () => salir());
    root.querySelectorAll('[data-anotar]').forEach(b => b.onclick = () => anotar());
    const c = root.querySelector('[data-cuenta]'); if(c) c.onclick = cuenta;
  }
  function marcar(){ root.querySelectorAll('.sp-nav [data-area]').forEach(b => b.classList.toggle('on', b.dataset.area === area || b.dataset.area === GRUPO[area])); }
  function cuenta(){
    const w = document.createElement('div'); w.className = 'sp-mas';
    w.innerHTML = `<div><button data-fuera>${sv("<path d='M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4'/>")}<span>Salir<small>${esc(auth.email)}</small></span></button></div>`;
    document.body.appendChild(w);
    w.onclick = e => { const b = e.target.closest('button'); if(e.target === w || b) w.remove(); if(b && b.dataset.fuera !== undefined) salir(); };
  }
  function ir(a){
    if(a === 'academias' || a === 'plata'){ a = ultimo[a]; }
    if(!TIT[a] || (!esAdmin() && GRUPO[a] === 'plata')) a = 'hoy';
    if(esRecep()) a = 'particulares';
    area = a; try{ sessionStorage.setItem('storm-area', a); }catch(_){}
    const g = GRUPO[a]; if(g){ ultimo[g] = a; try{ sessionStorage.setItem('storm-ultimo', JSON.stringify(ultimo)); }catch(_){} }
    bindNav(); marcar();
    const panel = ['anual', 'verano', 'adultos', 'finanzas', 'sueldos'].includes(a);
    root.querySelectorAll('.sp-area').forEach(x => x.hidden = !(x.dataset.a === a || (panel && x.dataset.a === 'panel')));
    if(a === 'finanzas' || a === 'sueldos'){ StormPanel.fsub(a === 'sueldos' ? 'gastos' : 'finanzas'); StormPanel.ir('finanzas'); }
    else if(panel) StormPanel.ir(a);
    root.querySelector('.sp-top h1').textContent = TIT[a];
    root.querySelector('.sp-top p').textContent = a === 'hoy' ? hoyLargo() : '';
    const seg = root.querySelector('.sp-seg');
    seg.hidden = !g;
    if(g){
      seg.innerHTML = SEG[g].map(([k, t]) => `<button class='${k === a ? 'on' : ''}' data-seg='${k}'>${t}</button>`).join('');
      seg.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { const [x, sub] = b.dataset.seg.split(':'); ir(x); if(sub) StormEscuela.ir(sub); });
    }
    if(a === 'hoy') pintarHoy();
    window.scrollTo(0, 0);
  }

  // ---------- Anotar en 3 toques: monto, en qué, área ----------
  const AREAS = [['Verano', 'Verano', 'verano'], ['Anual', 'Anual', 'anual'], ['Adultos', 'Adultos', 'adultos'], ['Escuela', 'Particulares', 'particulares'], ['Rentas', 'Rentas', 'tabla'], ['Surfshop', 'Surf Shop', 'tienda'], ['Casa', 'Casa Storm', 'casa']];
  const ATAJOS = { gasto: { Verano: ['Comida', 'Premios', 'Sala de yoga', 'Materiales', 'Bencina'], Casa: ['Mantención oficina', 'Crecimiento', 'Marketing'], _: ['Bencina', 'Comida', 'Parafina', 'Materiales', 'Hielo', 'Reparación'] },
                   ingreso: { Rentas: ['Arriendo tabla', 'Arriendo traje'], Surfshop: ['Venta tienda'], Escuela: ['Clase particular'], _: ['Clase particular', 'Arriendo tabla', 'Venta tienda', 'Auspicio'] } };
  const GASTA = ['Verano', 'Anual', 'Surfshop', 'Casa']; // Adultos, particulares y rentas no tienen gastos propios (solo sueldos, que se calculan solos)
  const anioVer = (() => { const d = new Date(); return d.getFullYear() + (d.getMonth() >= 2 ? 1 : 0); })();
  let AN = null;
  function anotar(){
    const m = new Date().getMonth();
    AN = { tipo: 'gasto', monto: '', detalle: '', area: (() => { try{ return localStorage.getItem('storm-ultima-area') || ''; }catch(_){ return ''; } })() || ([10, 11, 0, 1].includes(m) ? 'Verano' : 'Anual'), corr: m === 1 ? 'febrero' : 'enero' };
    if(!GASTA.includes(AN.area)) AN.area = 'Casa';
    const w = document.createElement('div'); w.className = 'sp-mas sp-an'; document.body.appendChild(w);
    pintarAnotar(w);
    setTimeout(() => { const i = w.querySelector('#an-monto'); if(i) i.focus(); }, 60);
  }
  function pintarAnotar(w){
    const at = (ATAJOS[AN.tipo][AN.area] || ATAJOS[AN.tipo]._);
    const fmt = v => v ? Number(v).toLocaleString('es-CL') : '';
    w.innerHTML = `<div><button class='sp-fx' aria-label='Cerrar'>✕</button>
      <h2 class='an-h'>${AN.tipo === 'gasto' ? 'Anotar gasto' : 'Anotar ingreso'}</h2>
      <label class='an-monto'><span>$</span><input id='an-monto' inputmode='numeric' placeholder='0' value='${fmt(AN.monto)}' autocomplete='off'></label>
      <p class='an-q'>¿En qué?</p>
      <div class='an-chips'>${at.map(x => `<button class='${AN.detalle === x ? 'on' : ''}' data-det='${esc(x)}'>${esc(x)}</button>`).join('')}</div>
      <input id='an-det' class='an-det' placeholder='O escribe aquí' value='${at.includes(AN.detalle) ? '' : esc(AN.detalle)}'>
      <p class='an-q'>¿De qué área?</p>
      <div class='an-areas'>${AREAS.filter(x => AN.tipo === 'ingreso' || GASTA.includes(x[0])).map(([k, t, ic]) => `<button class='${AN.area === k ? 'on' : ''}' data-ar='${k}'>${I[ic] || ''}<span>${t}</span></button>`).join('')}</div>
      ${AN.area === 'Verano' ? `<p class='an-q'>¿A qué mes del Verano?</p><div class='an-chips'>${['enero', 'febrero', 'ambos'].map(c => `<button class='${AN.corr === c ? 'on' : ''}' data-corr='${c}'>${c === 'ambos' ? 'Enero y febrero' : c[0].toUpperCase() + c.slice(1)}</button>`).join('')}</div>` : ''}
      <button class='an-go' data-go>Guardar ${AN.tipo}</button><p class='an-err'></p>
      <div class='an-otros'><button data-tipo='${AN.tipo === 'gasto' ? 'ingreso' : 'gasto'}'>${AN.tipo === 'gasto' ? 'Es un ingreso' : 'Es un gasto'}</button><button data-clase>Agendar clase particular</button></div></div>`;
    const leerCampos = () => { AN.monto = String(w.querySelector('#an-monto').value).replace(/\D/g, ''); const d = w.querySelector('#an-det').value.trim(); if(d) AN.detalle = d; };
    const mi = w.querySelector('#an-monto'); mi.oninput = () => { const v = mi.value.replace(/\D/g, ''); mi.value = fmt(v); AN.monto = v; };
    w.onclick = async e => {
      if(e.target === w || e.target.closest('.sp-fx')) return w.remove();
      const t = e.target.closest('button'); if(!t) return;
      if(t.dataset.clase !== undefined){ w.remove(); ir('particulares'); return StormEscuela.nueva(); }
      if(t.dataset.tipo){ leerCampos(); AN.tipo = t.dataset.tipo; AN.detalle = ''; if(AN.tipo === 'gasto' && !GASTA.includes(AN.area)) AN.area = 'Casa'; return pintarAnotar(w); }
      if(t.dataset.det){ leerCampos(); AN.detalle = AN.detalle === t.dataset.det ? '' : t.dataset.det; return pintarAnotar(w); }
      if(t.dataset.ar){ leerCampos(); AN.area = t.dataset.ar; return pintarAnotar(w); }
      if(t.dataset.corr){ leerCampos(); AN.corr = t.dataset.corr; return pintarAnotar(w); }
      if(t.dataset.go !== undefined){
        leerCampos(); const er = w.querySelector('.an-err');
        if(!+AN.monto){ er.textContent = 'Falta el monto.'; return w.querySelector('#an-monto').focus(); }
        if(!AN.detalle){ er.textContent = 'Elige o escribe en qué fue.'; return w.querySelector('#an-det').focus(); }
        t.disabled = true; t.textContent = 'Guardando…';
        try{
          await StormPanel.anotar({ tipo: AN.tipo, area: AN.area, detalle: AN.detalle, monto: +AN.monto, corresponde: AN.area === 'Verano' ? (AN.corr === 'ambos' ? 'verano ' + anioVer : AN.corr + ' ' + anioVer) : '' });
          try{ localStorage.setItem('storm-ultima-area', AN.area); }catch(_){}
          w.remove(); aviso(`Anotado: $${Number(AN.monto).toLocaleString('es-CL')} · ${AN.detalle}`);
          if(area === 'hoy') pintarHoy();
        }catch(x){ t.disabled = false; t.textContent = 'Guardar ' + AN.tipo; er.textContent = 'No se guardó: ' + x.message; }
      }
    };
  }
  function aviso(t){
    const a = document.createElement('div'); a.className = 'es-toast'; a.innerHTML = `<span class='es-ti'>✓</span>${esc(t)}`;
    document.body.appendChild(a); setTimeout(() => a.remove(), 5200);
  }
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const hoyLargo = () => { const d = new Date(); return DIAS[d.getDay()].replace(/^./, c => c.toUpperCase()) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };

  function pintarHoy(){
    const el = root.querySelector('[data-a="hoy"]'); if(!el) return;
    const E = StormEscuela.datos(), P = StormPanel.datos(), V = StormPanel.verano(), adm = esAdmin();
    if(!E && !P){ el.innerHTML = `<div class='pn-skel'></div><div class='pn-skel'></div>`; return; }
    const yo = E && E.yo;
    const part = E ? E.reservas.filter(r => r.estado !== 'cancelada' && (adm || r.instructores.includes(yo))) : [];
    const hoyF = E ? E.hoy : '';
    const partHoy = part.filter(r => r.fecha === hoyF);
    const espera = part.filter(r => r.fecha >= hoyF && (r.estado === 'pendiente' || r.medio === 'Por pagar'));
    const sinFicha = part.filter(r => r.fecha >= hoyF && r.estado !== 'pendiente' && (r.fichas || []).length < r.personas);
    const acadHoy = P ? (P.clases || []).filter(c => c.cuando === 'Hoy') : [];
    const faltan = P && P.actual ? P.actual.faltan.reduce((t, f) => t + f.alumnos.length, 0) : 0;
    const avisos = P && P.sinGrupo ? P.sinGrupo.length + (P.revisar || []).length : 0;
    const tile = (cls, ico, n, t, s, go) => `<button class='sp-tile ${cls}' data-go='${go}'><i>${ico}</i><b>${n}</b><span>${t}</span>${s ? `<small>${s}</small>` : ''}</button>`;
    let h = `<div class='sp-tiles'>
      ${tile('', I.hoy, partHoy.length + acadHoy.filter(c => !c.cancelada).length, 'clases hoy', partHoy.length ? partHoy.length + ' particular' + (partHoy.length === 1 ? '' : 'es') : '', 'hoy-lista')}
      ${adm ? tile(faltan ? 'warn' : 'ok', I.pago, faltan, 'faltan por pagar', 'Academia Anual', 'anual:pagos') : ''}
      ${adm ? tile(espera.length ? 'warn' : 'ok', I.pago, espera.length, 'particulares sin pagar', '', 'particulares:reservas') : ''}
      ${tile(sinFicha.length ? 'warn' : 'ok', I.ficha, sinFicha.length, 'clases sin fichas', 'particulares', 'particulares:reservas')}
      ${adm && avisos ? tile('warn', I.grupo, avisos, 'avisos de la Anual', 'alumnos sin grupo o pagos', 'anual:avisos') : ''}
      ${(() => { const d0 = new Date(), fm = new Date(d0.getFullYear(), d0.getMonth() + 1, 0).getDate() - d0.getDate() < 3; return adm && (fm || [5, 6, 0].includes(d0.getDay())) ? tile('', I.pago, '$', fm ? 'revisar sueldos del mes' : 'revisar sueldos de la semana', 'instructores', fm ? 'sueldos' : 'particulares:pagos') : ''; })()}
    </div>`;
    // línea de tiempo del día
    const lineas = [];
    partHoy.forEach(r => lineas.push({ h: r.hora, html: `<button class='sp-line' data-go='particulares:dia'><span class='h'>${esc(r.hora)}</span><span><b>${esc(r.nombre)}</b><small>${r.personas} persona${r.personas === 1 ? '' : 's'} · ${r.instructores.map(esc).join(' y ')}</small></span><span class='tag'>Particular</span></button>` }));
    acadHoy.forEach(c => lineas.push({ h: String(c.horario || '').slice(0, 5), html: `<button class='sp-line anual${c.cancelada ? ' cancel' : ''}' data-go='anual:clases'><span class='h'>${esc(String(c.horario || '').replace(/\s*hrs?\.?$/i, ''))}</span><span><b>${esc(c.clase)}</b><small>${c.cancelada ? 'Cancelada' : (c.van || 0) + ' alumnos'}</small></span><span class='tag'>Anual</span></button>` }));

    // lo que viene mañana
    const man = E ? part.filter(r => r.fecha === sumar(hoyF, 1)) : [];
    const acadMan = P ? (P.clases || []).filter(c => c.cuando === 'Mañana') : [];
    if(man.length || acadMan.length){
      h += `<p class='sp-h3'>Mañana</p>` + man.map(r => `<button class='sp-line' data-go='particulares:dia'><span class='h'>${esc(r.hora)}</span><span><b>${esc(r.nombre)}</b><small>${r.personas} persona${r.personas === 1 ? '' : 's'} · ${r.instructores.map(esc).join(' y ')}</small></span><span class='tag'>Particular</span></button>`).join('')
        + acadMan.map(c => `<button class='sp-line anual${c.cancelada ? ' cancel' : ''}' data-go='anual:clases'><span class='h'>${esc(String(c.horario || '').replace(/\s*hrs?\.?$/i, ''))}</span><span><b>${esc(c.clase)}</b><small>${c.cancelada ? 'Cancelada' : (c.van || 0) + ' alumnos'}</small></span><span class='tag'>Anual</span></button>`).join('');
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      const [a, s] = b.dataset.go.split(':');
      if(a === 'hoy-lista') return document.getElementById('hoy-lista').scrollIntoView({ behavior: 'smooth' });
      ir(a);
      if(a === 'particulares' && s) StormEscuela.ir(s);
      if(a === 'anual' && s) setTimeout(() => StormPanel.tab(s), 50);
      if(a === 'particulares' && !s) StormEscuela.ir('dia');
    });
  }
  // ---------- buscador: una persona, todas las áreas ----------
  const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function personas(){
    const out = [], ya = {};
    const add = (n, tipo, sub, go, tel) => { const k = norm(n) + '|' + tipo; if(!n || ya[k]) return; ya[k] = 1; out.push({ n, tipo, sub, go, tel }); };
    const E = StormEscuela.datos(), P = StormPanel.datos();
    if(E) E.reservas.slice().reverse().forEach(r => add(r.nombre, 'Particular', (r.fecha >= E.hoy ? 'Próxima clase ' : 'Última clase ') + r.fecha.split('-').reverse().slice(0, 2).join('/') + ' ' + r.hora, 'particulares:reservas', r.telefono));
    if(P){
      (P.clases || []).forEach(c => (c.alumnos || []).forEach(a => add(a.nombre, 'Anual', a.grupo || '', 'anual:alumnos')));
      ((P.actual || {}).faltan || []).forEach(f => { f.alumnos.forEach(a => add(a, 'Anual', 'Falta pagar este mes', 'anual:pagos', f.telefono)); if(f.apoderado) add(f.apoderado, 'Apoderado', 'de ' + f.alumnos.join(' y '), 'anual:pagos', f.telefono); });
      ((P.actual || {}).pagaron || []).forEach(x => add(x.alumno, 'Anual', 'Plan ' + (x.plan || '') + (x.grupo ? ' · ' + x.grupo : ''), 'anual:alumnos'));
    }
    return out;
  }
  function buscador(){
    const q = root.querySelector('#sp-q'), res = root.querySelector('.sp-res'); if(!q) return;
    const pintar = () => {
      const t = norm(q.value.trim()); if(t.length < 2){ res.hidden = true; return; }
      const l = personas().filter(x => norm(x.n).split(/\s+/).some(w => w.startsWith(t)) || norm(x.n).includes(t)).slice(0, 12);
      res.hidden = false;
      res.innerHTML = l.length ? l.map((x, i) => { let k = 0; for(const ch of x.n) k = (k * 31 + ch.charCodeAt(0)) % 997;
        return `<div class='sp-ri'><button data-ri='${i}'><span class='sp-av' style='background:${COL[k % COL.length]}'>${esc(x.n.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span><span><b>${esc(x.n)}</b><small>${esc(x.sub)}</small></span><em class='${x.tipo === 'Particular' ? '' : 'a'}'>${x.tipo}</em></button>${wa(x.tel) ? `<a class='sp-wa' href='https://wa.me/${wa(x.tel)}' target='_blank' rel='noopener' aria-label='WhatsApp'>${WA}</a>` : ''}</div>`; }).join('')
        : `<p class='sp-nada'>No encontré a nadie con ese nombre.</p>`;
      res.querySelectorAll('[data-ri]').forEach(b => b.onclick = () => {
        const x = l[+b.dataset.ri]; q.value = ''; res.hidden = true; ficha(x);
      });
    };
    q.oninput = pintar; q.onfocus = pintar;
    document.addEventListener('click', e => { if(!e.target.closest('.sp-bus')) res.hidden = true; });
  }
  // ---------- ficha de una persona: todo lo de ella en un lugar ----------
  const clpS = n => '$' + Math.round(n || 0).toLocaleString('es-CL');
  function ficha(x){
    const E = StormEscuela.datos(), P = StormPanel.datos(), n = norm(x.n), adm = esAdmin();
    const mismas = E ? E.reservas.filter(r => norm(r.nombre) === n || (x.tel && wa(r.telefono) === wa(x.tel))) : [];
    const anual = [];
    if(P){
      const g = {}; (P.clases || []).forEach(c => (c.alumnos || []).forEach(a => { if(norm(a.nombre) === n) g.grupo = a.grupo; }));
      const pg = ((P.actual || {}).pagaron || []).find(p => norm(p.alumno) === n);
      const fa = ((P.actual || {}).faltan || []).find(f => f.alumnos.some(a => norm(a) === n) || norm(f.apoderado) === n);
      const dias = [...new Set((P.clases || []).filter(c => !c.cancelada && (c.alumnos || []).some(a => norm(a.nombre) === n)).map(c => String(c.texto || '').split(' ')[0].toLowerCase()).filter(Boolean))];
      const NT = StormPanel.alumnos(); const nt = NT && NT.notas ? NT.notas.filter(x => norm(x.alumno) === n).length : 0;
      const al = NT && NT.alumnos ? NT.alumnos.find(a => norm(a.nombre) === n) : null; if(al && al.grupo) g.grupo = al.grupo;
      if(g.grupo || pg || fa || al) anual.push({ dias, nt, grupo: g.grupo || (pg && pg.grupo) || '', plan: pg && pg.plan, pago: pg ? (pg.monto ? 'Pagó ' + clpS(pg.monto) : 'Beca Storm') : fa ? 'Falta pagar' + (fa.monto && adm ? ' ' + clpS(fa.monto) : '') : '', debe: !!fa, hijos: fa && norm(fa.apoderado) === n ? fa.alumnos : null });
    }
    const tel = x.tel || (mismas[0] && mismas[0].telefono) || '';
    const k = [...x.n].reduce((k, ch) => (k * 31 + ch.charCodeAt(0)) % 997, 0);
    const est = r => r.estado === 'cancelada' ? ['gris', 'Cancelada'] : r.estado === 'pendiente' || r.medio === 'Por pagar' ? ['pend', 'Falta pagar'] : ['ok', 'Pagada'];
    const w = document.createElement('div'); w.className = 'sp-mas sp-fi';
    w.innerHTML = `<div><button class='sp-fx' aria-label='Cerrar'>✕</button>
      <div class='sp-fh'><span class='sp-av' style='background:${COL[k % COL.length]}'>${esc(x.n.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span><div><h2>${esc(x.n)}</h2><p>${[mismas.length ? 'Particulares' : '', anual.length ? 'Academia Anual' : ''].filter(Boolean).join(' · ') || esc(x.tipo)}</p></div></div>
      ${wa(tel) ? `<div class='sp-fc'><a class='w' href='https://wa.me/${wa(tel)}' target='_blank' rel='noopener'>${WA}<span>WhatsApp</span></a><a href='tel:+${wa(tel)}'>${I.tel}<span>Llamar</span></a></div>` : ''}
      ${anual.map(a => `<p class='sp-h3'>Academia Anual</p><div class='sp-fb anual'>${a.hijos ? `<div><small>Apoderado de</small><b>${a.hijos.map(esc).join(', ')}</b></div>` : ''}${a.grupo ? `<div><small>Grupo</small><b>${esc(a.grupo)}</b></div>` : ''}${a.plan ? `<div><small>Plan</small><b>${esc(a.plan)}</b></div>` : ''}${a.dias && a.dias.length ? `<div><small>Viene</small><b>${esc(a.dias.join(' y '))}</b></div>` : ''}${a.pago ? `<div><small>Este mes</small><b class='${a.debe ? 'pend' : 'ok'}'>${a.debe ? '● ' : '✓ '}${esc(a.pago)}</b></div>` : ''}</div>
      ${a.hijos ? '' : `<div class='sp-fc' style='margin-top:8px'>${adm ? `<a href='#' data-alu='nivel'>${I.anual}<span>Cambiar nivel</span></a>` : ''}<a href='#' data-alu='notas'>${I.ficha}<span>Notas${a.nt ? ' (' + a.nt + ')' : ''}</span></a></div>`}
      <button class='sp-fgo' data-fgo='anual:${a.debe ? 'pagos' : 'alumnos'}'>Ver en Academia Anual ›</button>`).join('')}
      ${mismas.length ? `<p class='sp-h3'>Clases particulares · ${mismas.length}</p>` + mismas.slice().sort((a, b) => a.fecha < b.fecha ? 1 : -1).map(r => { const [c, t] = est(r); return `<div class='sp-fr ${c}'><b>${r.fecha.split('-').reverse().join('/')} · ${esc(r.hora)}</b><span>${r.personas} persona${r.personas === 1 ? '' : 's'} · ${r.instructores.map(esc).join(' y ')}${adm && r.total ? ' · ' + clpS(r.total) : ''}</span><em>${t}</em></div>`; }).join('') + `<button class='sp-fgo' data-fgo='particulares:reservas'>Ver en Particulares ›</button>` : ''}
    </div>`;
    document.body.appendChild(w);
    w.onclick = e => {
      if(e.target === w || e.target.closest('.sp-fx')) return w.remove();
      const al = e.target.closest('[data-alu]'); if(al){ e.preventDefault(); w.remove(); ir('anual'); return StormPanel.alumno(x.n, al.dataset.alu); }
      const g = e.target.closest('[data-fgo]'); if(!g) return;
      w.remove(); const [a, s2] = g.dataset.fgo.split(':'); ir(a); if(a === 'particulares') StormEscuela.ir(s2); else setTimeout(() => StormPanel.tab(s2), 60);
    };
  }
  const wa = t => { let n = String(t || '').replace(/\D/g, ''); if(n.length === 9 && n[0] === '9') n = '56' + n; if(n.length === 8) n = '569' + n; return n.length >= 10 ? n : ''; };
  const COL = ['#0f6e74', '#2d6e94', '#b5662b', '#7a5a9e', '#2f7a4d', '#a6402c', '#5b6b7a', '#9a7b1f'];
  const WA = `<svg viewBox='0 0 24 24' fill='currentColor'><path d='M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.2 21.8l5.1-1.3A9.7 9.7 0 1 0 12 2.2Zm0 17.7c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9Zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1l-.4-.2Z'/></svg>`;
  function realzar(el){
    el.querySelectorAll('.pn-chip:not([data-av])').forEach(c => {
      c.dataset.av = 1; const t = c.textContent.replace(/[↪\s]+/, ' ').trim(); if(!t) return; c.dataset.nombre = t; c.classList.add('sp-tap');
      const ini = t.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      let k = 0; for(const ch of t) k = (k * 31 + ch.charCodeAt(0)) % 997;
      c.insertAdjacentHTML('afterbegin', `<span class='sp-av' style='background:${COL[k % COL.length]}'>${esc(ini)}</span>`);
    });
    const av = t => { const ini = t.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); let k = 0; for(const ch of t) k = (k * 31 + ch.charCodeAt(0)) % 997; return `<span class='sp-av sp-av2' style='background:${COL[k % COL.length]}'>${esc(ini)}</span>`; };
    el.querySelectorAll('.pn-sub').forEach(x => { if(/^Anota cómo va cada alumno/.test(x.textContent)) x.textContent = 'Toca un alumno para ver su ficha, cambiar su nivel o anotar notas. Las notas son solo para el equipo.'; });
    el.querySelectorAll('.pn-al[data-alumno]:not([data-av])').forEach(r => {
      r.dataset.av = 1; r.classList.add('sp-alr');
      const kids = [...r.children]; if(kids[1] && kids[1].querySelector('button')) kids[1].classList.add('sp-alacc');
      if(kids[0]) { kids[0].classList.add('sp-aln'); kids[0].insertAdjacentHTML('afterend', `<span class='sp-chev'>›</span>`); }

  }
  const sumar = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  abrir();
})();

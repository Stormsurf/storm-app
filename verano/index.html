<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Verano · Storm Academia de Verano</title>
<meta name="theme-color" content="#EFECE8">
<link rel="manifest" href="/verano/manifest.webmanifest">
<link rel="icon" href="/icons/storm-app-192.png">
<link rel="apple-touch-icon" href="/icons/storm-app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Verano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=1">
</head>
<body>
<header class="ap-top"><a href="https://www.stormsurf.cl" aria-label="Storm"><img src="/img/storm-logo.png" alt="Storm" width="96" height="52"></a></header>
<main>
<style>body{background:#F6EDC4}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
.mv{--ink:#3B2610;--muted:#6B5F51;--sea:#4A6B70;--wax:#FADF70;--foam:#F6EDC4;--line:#efe8d6;--display:"Chau Philomene One","Arial Narrow",sans-serif;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--foam);padding:28px 16px 64px;font-size:16px;line-height:1.5}
.mv *{box-sizing:border-box}
.mv .w{max-width:560px;margin:0 auto}
.mv .top{background:var(--sea);border-radius:22px;text-align:center;padding:26px 20px}
.mv .top img{width:220px;max-width:70%;height:auto}
.mv h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(30px,7vw,40px);line-height:1;margin:22px 0 4px}
.mv .sub{color:var(--muted);margin:0 0 6px}
.mv .card{background:#fff;border-radius:20px;padding:22px;margin-top:14px;box-shadow:0 6px 20px rgba(59,38,16,.06)}
.mv .card h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.05;margin:0}
.mv .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.mv .tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--foam)}
.mv .tag.y{background:var(--wax)}
.mv .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.mv .sem{display:flex;flex-wrap:wrap;gap:6px}
.mv .sem span{border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
.mv .dia{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.mv .dia b{flex:none;width:92px;font-size:15px}
.mv .dia span{font-size:15px}
.mv .dia.off span{color:var(--muted)}
.mv .hor{font-size:15px;margin:2px 0 0}
.mv .traer{white-space:pre-line;font-size:15px;margin:6px 0 0}
.mv input{display:block;width:100%;border:1.5px solid #d7d2c7;border-radius:12px;padding:14px;font:inherit;font-size:17px;text-align:center;background:#fff;color:var(--ink);margin:0 0 12px}
.mv input.code{letter-spacing:.4em;font-size:24px;font-weight:700}
.mv button.go,.mv a.go{display:block;width:100%;text-align:center;text-decoration:none;border:2px solid var(--ink);background:var(--wax);color:var(--ink);border-radius:12px;padding:14px;font-family:var(--display);text-transform:uppercase;font-size:17px;cursor:pointer}
.mv a.go.wa{background:#25D366;border-color:#25D366;color:#fff;margin-top:10px}
.mv .err{color:#B3261E;font-size:14px;margin:0 0 10px}
.mv .link{background:none;border:0;color:var(--sea);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:0}
.mv .skel{height:120px;border-radius:20px;margin-top:14px;background:linear-gradient(90deg,#fff,#faf6ea,#fff);background-size:200% 100%;animation:mvk 1.2s infinite linear}
@keyframes mvk{to{background-position:-200% 0}}
.mv .center{text-align:center}
</style>
<div class="mv"><div class="w">
  <div class="top"><img src="/img/verano-logo.png" alt="Academia de Verano Storm" width="220" height="71"></div>
  <div id="mv-app"><div class="skel"></div></div>
</div></div>
<script>
(function(){
  const API = "https://script.google.com/macros/s/AKfycbzSHDu8whWWNwq-EFwaWqwKOtyU5pnyPuixutUI8sd5twFaTjDibN11TA3bMH_UddTo/exec";
  const KEY = "storm-verano";
  const app = document.getElementById("mv-app");
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const post = async b => { const r = await (await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)})).json(); if(!r.ok) throw new Error(r.error||"Error"); return r; };
  const leer = () => { try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(_){ return null; } };
  const guardar = s => { try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(_){} };
  let auth = leer();

  function login(email, err, paso){
    app.innerHTML = `<h1>Mi Verano</h1><p class="sub">Revisa las semanas de tus hijos, qué hacen cada día y qué traer.</p>
      <div class="card center">${paso==="codigo"
        ? `<p>Te mandamos un código a <b>${esc(email)}</b>.</p>${err?`<p class="err">${esc(err)}</p>`:""}<input class="code" id="mv-c" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button class="go" id="mv-b">Entrar</button><p style="margin:14px 0 0"><button class="link" id="mv-x">Usar otro correo</button></p>`
        : `<p>Escribe el correo con el que inscribiste a tus hijos.</p>${err?`<p class="err">${esc(err)}</p>`:""}<input type="email" id="mv-e" autocomplete="email" placeholder="nombre@correo.cl" value="${esc(email||"")}"><button class="go" id="mv-b">Recibir código</button>`}</div>`;
    const b = document.getElementById("mv-b");
    if(paso==="codigo"){
      const c = document.getElementById("mv-c"); c.focus();
      const ir = async () => { b.disabled = true; b.textContent = "Entrando…";
        try{ const s = await post({accion:"entrar", email, codigo:c.value}); auth = {email:s.email, ts:s.ts, firma:s.firma}; guardar(auth); cargar(); }
        catch(x){ login(email, x.message, "codigo"); } };
      b.onclick = ir; c.addEventListener("input", () => { if(c.value.replace(/\D/g,"").length===6) ir(); });
      document.getElementById("mv-x").onclick = () => login("");
    } else {
      const e = document.getElementById("mv-e");
      const ir = async () => { const v = e.value.trim().toLowerCase(); if(!v) return; b.disabled = true; b.textContent = "Enviando…";
        try{ await post({accion:"pedir-codigo", email:v}); login(v, "", "codigo"); } catch(x){ login(v, x.message); } };
      b.onclick = ir; e.addEventListener("keydown", ev => { if(ev.key==="Enter") ir(); });
    }
  }

  function pintar(d){
    let h = `<h1>Mi Verano</h1><p class="sub">${esc(d.email)} · <button class="link" id="mv-out">Salir</button></p>`;
    if(!d.hijos.length) h += `<div class="card"><p>No encontramos niños inscritos con este correo. Si ya pagaste, espera unos minutos o escríbenos por WhatsApp.</p></div>`;
    d.hijos.forEach(k => {
      h += `<div class="card"><h2>${esc(k.nombre)}</h2>
        <div class="tags"><span class="tag y">${esc(k.nivel)}</span>${k.edad?`<span class="tag">${esc(k.edad)}</span>`:""}${k.tabla?`<span class="tag">Arrienda tabla</span>`:""}${k.traje?`<span class="tag">Arrienda traje</span>`:""}</div>
        <p class="lbl">Inscrito en</p><div class="sem">${k.semanas.map(s=>`<span>${esc(s)}</span>`).join("")}</div>
        ${k.horario?`<p class="lbl">Horario</p><p class="hor">${esc(k.horario)}</p>`:""}
        ${k.dias.length?`<p class="lbl">Su semana</p>${k.dias.map(x=>`<div class="dia${/^sin /i.test(x.que)?" off":""}"><b>${esc(x.dia)}</b><span>${esc(x.que)}</span></div>`).join("")}`:""}
      </div>`;
    });
    if(d.traer) h += `<div class="card"><h2>Qué traer</h2><p class="traer">${esc(d.traer)}</p></div>`;
    h += `<div class="card center"><p style="margin:0 0 12px">¿Dudas o un cambio?</p><a class="go wa" href="https://wa.me/56977744306" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></div>`;
    app.innerHTML = h;
    document.getElementById("mv-out").onclick = () => { try{ localStorage.removeItem(KEY); }catch(_){} auth = null; login(""); };
  }

  async function cargar(){
    if(!auth) return login("");
    app.innerHTML = `<div class="skel"></div><div class="skel"></div>`;
    try{ pintar(await post(Object.assign({accion:"mi-verano"}, auth))); }
    catch(x){ const e = auth.email; try{ localStorage.removeItem(KEY); }catch(_){} auth = null; login(e, /sesión/i.test(x.message) ? "Por seguridad, vuelve a entrar." : x.message); }
  }
  cargar();
})();
</script>

</main>
<script>window.STORM_APP = { appId: "be18352b-5820-4912-aa46-d851890394a3", safariId: "web.onesignal.auto.1afb9025-a2b0-4a54-8c00-23b218b2b39b", clave: "storm-verano", nombre: "Mi Verano", raiz: "/" };</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="/app.js?v=1" defer></script>
</body>
</html>

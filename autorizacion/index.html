<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Autorización y exención de responsabilidad · Storm</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFECE8">
<link rel="icon" href="/icons/storm-app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=2">
<style>
.au{--ac:#61A1C8;--ink:#2C2C2B;--mute:#6b6a67;--line:rgba(44,44,43,.12);--ok:#3f8f5f;max-width:620px;margin:0 auto;color:var(--ink)}
.au *{box-sizing:border-box}
.au h1{margin:0;font-size:2.4rem;line-height:1.2;font-weight:600;text-align:center}
.au-sub{margin:8px auto 0;text-align:center;color:var(--mute);font-size:1.4rem;max-width:460px;line-height:1.5}
.au-card{background:#fff;border-radius:22px;padding:20px 18px;margin-top:14px}
.au-card h2{margin:0 0 10px;font-size:1.7rem;font-weight:600}
.au-quien{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:1.4rem}
.au-quien span{display:block;color:var(--mute);font-size:1.15rem}
.au-quien b{font-weight:600}
.au-quien .w{grid-column:1/-1}
.au-txt{font-size:1.35rem;line-height:1.55;color:#3d3c3a;background:#F5F3EF;border-radius:14px;padding:14px 16px}
.au-txt h3{font-size:1.4rem;margin:12px 0 4px}.au-txt h3:first-child{margin-top:0}
.au-txt ol{margin:0;padding-left:20px}.au-txt li{margin:0 0 6px}
.au-txt p{margin:0 0 8px}.au-txt p:last-child{margin:8px 0 0;font-weight:600}
.au-f label{display:block;font-size:1.3rem;font-weight:600;margin:12px 0 5px}
.au-f input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;font-size:1.6rem;background:#fff;color:var(--ink)}
.au-f input[type=text]:focus{outline:none;border-color:var(--ac)}
.au-f .au-chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:1.4rem;font-weight:400;line-height:1.45;cursor:pointer}
.au-chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--ink)}
.au-go{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:1.7rem;font-weight:600;padding:16px;cursor:pointer}
.au-go:disabled{opacity:.45}
.au-err{margin:10px 0 0;color:#a12c1c;font-size:1.4rem}
.au-done{text-align:center;padding:26px 18px}
.au-done .ic{width:60px;height:60px;border-radius:50%;background:#e5f2ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:2.8rem}
.au-done h2{font-size:2.2rem;margin:0}
.au-done p{color:var(--mute);font-size:1.45rem;line-height:1.5;margin:8px 0 0}
.au-ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#effaf3;color:var(--ok);font-size:1.45rem;font-weight:600;margin-top:12px}
.au-firma img{display:block;max-width:100%;height:130px;object-fit:contain;margin-top:4px}
.au-print{display:inline-block;margin-top:14px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font:inherit;font-size:1.4rem;font-weight:600;cursor:pointer;color:var(--ink)}
.au-skel{height:220px;border-radius:16px;background:linear-gradient(90deg,#f3f1ed 25%,#ebe8e3 50%,#f3f1ed 75%);background-size:200% 100%;animation:au-sk 1.2s infinite}
@keyframes au-sk{to{background-position:-200% 0}}
.au-foot{text-align:center;margin:16px 0 0;font-size:1.15rem;color:var(--mute)}
@media print{.ap-top,.au-print,.au-foot{display:none}body{background:#fff}.au-card{padding:8px 0;border-radius:0}.au-txt{background:none;padding:0}}
</style>
</head>
<body>
<header class="ap-top"><a href="https://www.stormsurf.cl" aria-label="Storm"><img src="/img/storm-logo.png" alt="Storm" width="96" height="52"></a></header>
<main class="storm-section"><div class="au" id="au"><div class="au-skel"></div></div></main>
<script src="/autorizacion/textos.js?v=1"></script>
<script>
(()=>{
  const API = '/api/autorizacion';
  const q = new URLSearchParams(location.search), A = q.get('a') || '', N = q.get('n') || '', K = q.get('k') || '', DOC = q.get('doc') || '';
  const root = document.getElementById('au');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaLarga = f => { const m = String(f).match(/(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/); return m ? (+m[3]) + ' de ' + MES[+m[2]-1] + ' de ' + m[1] + (m[4] ? ', ' + m[4] : '') : f; };
  async function post(b){ const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)}); let d; try{ d = await r.json(); }catch(_){ throw new Error('No pudimos conectarnos. Revisa tu internet.'); } if(!d.ok) throw new Error(d.error || 'Error'); return d; }
  const texto = a => { const T = window.STORM_AUT[a]; return `<div class='au-txt'><p>${esc(T.intro)}</p>${T.secciones.map(([h, ps], i) => `${h ? `<h3>${esc(h)}</h3>` : ''}<ol start='${T.secciones.slice(0, i).reduce((n, s) => n + s[1].length, 0) + 1}'>${ps.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`).join('')}<p>${esc(T.cierre)}</p></div>`; };
  const COMO = { web: 'Marcó la casilla de aceptación al inscribirse y pagar en la web de Storm', shopify: 'Marcó la casilla de aceptación al inscribirse y pagar en la web de Storm (tienda)', firma: 'Marcó la casilla de aceptación en el link que le mandó Storm' };

  // ---- Documento para el equipo (desde el Panel) ----
  async function documento(){
    let s = null; try{ s = JSON.parse(localStorage.getItem('storm-panel') || 'null'); }catch(_){}
    if(!s){ root.innerHTML = `<div class='au-card'><p>Abre este documento desde el Panel Storm.</p></div>`; return; }
    try{
      const x = (await post(Object.assign({accion:'doc', id: DOC}, s))).autorizacion, T = window.STORM_AUT[x.academia];
      document.title = 'Autorización ' + x.alumno + ' · ' + T.nombre;
      root.innerHTML = `<h1>${esc(T.titulo)}</h1>
        <div class='au-card'><div class='au-quien'>
          <div class='w'><span>Alumno/a</span><b>${esc(x.alumno)}</b></div>
          <div><span>Apoderado/a</span><b>${esc(x.apoderado || '—')}</b></div>
          <div><span>RUT apoderado/a</span><b>${esc(x.rut || '—')}</b></div>
          <div><span>Fecha</span><b>${esc(fechaLarga(x.fecha))}</b></div>
          <div><span>${x.como === 'firma' ? 'Forma' : 'Referencia'}</span><b>${esc(x.como === 'firma' ? 'Link de Storm' : x.ref)}</b></div>
          <div class='w'><span>Cómo la aceptó</span><b>${esc(COMO[x.como] || x.como)}${x.correo ? ' (' + esc(x.correo) + ')' : ''}.</b></div>
        </div>
        <div class='au-ok'>✓ Aceptada por ${esc(x.apoderado || 'el apoderado')}</div></div>
        <div class='au-card'>${texto(x.academia)}
          ${x.firma ? `<div class='au-firma' style='margin-top:14px'><span style='font-size:1.15rem;color:var(--mute)'>Firma de ${esc(x.apoderado)}</span><img src='${esc(x.firma)}' alt='Firma'></div>` : ''}
          <button class='au-print' onclick='print()'>Imprimir o guardar PDF</button></div>
        <p class='au-foot'>Storm Academia de Surf · Matanzas</p>`;
    }catch(e){ root.innerHTML = `<div class='au-card'><p class='au-err'>${esc(e.message)}</p></div>`; }
  }

  // ---- Firmar (link que manda Storm al apoderado) ----
  let D = null, err = '';
  async function firmar(){
    try{ D = await post({accion:'ver', a: A, n: N, k: K}); }catch(e){ root.innerHTML = `<div class='au-card'><p class='au-err'>${esc(e.message)}</p></div>`; return; }
    pintar();
  }
  function pintar(){
    const T = window.STORM_AUT[D.academia];
    if(D.firmada){
      root.innerHTML = `<div class='au-card au-done'><div class='ic'>✓</div><h2>¡Autorización lista!</h2><p>${esc(D.firmada.apoderado)} aceptó la autorización de <b>${esc(D.alumno)}</b> para la ${esc(T.nombre)} el ${esc(fechaLarga(D.firmada.fecha))}. Gracias, ya no tienes que hacer nada más.</p></div>`;
      return;
    }
    root.innerHTML = `<h1>Autorización y exención de responsabilidad</h1>
      <p class='au-sub'>${esc(T.nombre)} · <b>${esc(D.alumno)}</b><br>Es obligatoria para que entre al mar. La acepta su madre, padre o apoderado/a y toma 1 minuto.</p>
      <div class='au-card'><h2>${esc(T.titulo)}</h2>${texto(D.academia)}</div>
      <div class='au-card au-f'><h2>Datos del apoderado/a</h2>
        <label for='au-nom'>Nombre y apellido</label><input type='text' id='au-nom' autocomplete='name'>
        <label for='au-rut'>RUT</label><input type='text' id='au-rut' inputmode='text' placeholder='12.345.678-9'>
        <label class='au-chk'><input type='checkbox' id='au-ok'> <span>Soy la madre, padre o apoderado/a de ${esc(D.alumno)}. Leí y acepto estos términos y esta exención de responsabilidad, y lo/la autorizo a participar.</span></label>
        ${err ? `<p class='au-err'>${esc(err)}</p>` : ''}
        <button class='au-go' id='au-go'>Aceptar</button></div>
      <p class='au-foot'>Storm Academia de Surf · Matanzas</p>`;
    root.querySelector('#au-go').onclick = async ev => {
      const b = ev.currentTarget, nom = root.querySelector('#au-nom').value, rut = root.querySelector('#au-rut').value, ok = root.querySelector('#au-ok').checked;
      const msg = m => { let e = root.querySelector('.au-err'); if(!e){ e = document.createElement('p'); e.className = 'au-err'; b.before(e); } e.textContent = m; };
      if(nom.trim().length < 3) return msg('Falta tu nombre y apellido.');
      if(!rut.trim()) return msg('Falta tu RUT.');
      if(!ok) return msg('Marca que leíste y aceptas.');
      b.disabled = true; b.textContent = 'Guardando…';
      try{ D = await post({accion:'firmar', a: A, n: N, k: K, apoderado: nom, rut, acepta: ok}); pintar(); scrollTo(0, 0); }
      catch(e){ b.disabled = false; b.textContent = 'Aceptar'; msg(e.message); }
    };
  }
  DOC ? documento() : firmar();
})();
</script>
</body>
</html>

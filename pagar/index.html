<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Pagar · Storm</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFECE8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/storm-app-192.png">
<link rel="apple-touch-icon" href="/icons/storm-app-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=2">
<style>
.pg{--ac:#4F7F86;--ac-soft:#E3EDEE;--ink:#2C2C2B;--line:rgba(44,44,43,.09);max-width:520px;margin:0 auto;padding:0 16px 40px;color:var(--ink)}
.pg-hero{text-align:center;margin-top:10px}
.pg-hero small{display:block;font-size:1.2rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:600}
.pg-hero h1{margin:6px 0 0;font-weight:600;font-size:3.4rem;line-height:1.1}
.pg-hero p{margin:6px auto 0;max-width:36ch;font-size:1.45rem;opacity:.7}
.pg-h2{margin:24px 0 10px;font-weight:500;font-size:1.9rem;text-align:center}
.pg-opt{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#fff;font:inherit;color:var(--ink);text-align:left;cursor:pointer;text-decoration:none}
.pg-opt i{font-style:normal;font-size:2.4rem;flex:none;width:40px;text-align:center}
.pg-opt b{display:block;font-size:1.7rem;font-weight:600}
.pg-opt small{display:block;font-size:1.3rem;opacity:.65;margin-top:2px}
.pg-opt.on{border-color:var(--ac);background:var(--ac-soft);box-shadow:inset 0 0 0 1px var(--ac)}
#brick{margin-top:12px}
.pg-fl{margin-top:10px;padding:14px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.pg-fl label{display:block;font-size:1.35rem;opacity:.75;margin-bottom:6px}
.pg-fl input{width:100%;box-sizing:border-box;font:inherit;font-size:1.6rem;padding:12px;border-radius:10px;border:1.5px solid var(--line)}
.pg-fl button{width:100%;margin-top:10px;font:inherit;font-size:1.6rem;font-weight:600;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
.pg-fl button:disabled{opacity:.5}
.pg-fl p{font-size:1.3rem;opacity:.65;margin:10px 0 0;line-height:1.45}
.pg-err{margin-top:12px;padding:12px 14px;border-radius:12px;background:#F6E3DF;font-size:1.45rem}
.pg-ok{margin-top:16px;padding:16px;border-radius:14px;background:var(--ac-soft);font-size:1.5rem;text-align:center}
.pg-note{font-size:1.3rem;opacity:.6;margin-top:16px;line-height:1.5;text-align:center}
.pg-note a{color:inherit}
</style>
</head>
<body>
<header class="ap-top"><a href="/" aria-label="Storm"><img src="/img/storm-logo.png" alt="Storm" width="96" height="52"></a></header>
<main class="pg" id="pg"><p class="pg-note">…</p></main>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<script>
(() => {
  const pg = document.getElementById('pg');
  const id = new URLSearchParams(location.search).get('o') || '';
  const clp = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CL');
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let D = null, brick = null, pagando = false;
  // Celular o computador en otro idioma (extranjeros): el formulario de la tarjeta sale en inglés
  let EN = !/^es\b/i.test(navigator.language || 'es');
  try{ const g = localStorage.getItem('storm-lang'); if(g) EN = g === 'en'; }catch(_){}
  { const l = new URLSearchParams(location.search).get('l'); if(l === 'es' || l === 'en') EN = l === 'en'; }
  if(EN){ document.documentElement.lang = 'en'; document.title = 'Pay · Storm'; }
  const ayuda = `<p class="pg-note">${EN ? 'Payments are processed securely by Mercado Pago. Questions?' : 'El pago lo procesa Mercado Pago de forma segura. ¿Dudas?'} <a href="https://wa.me/56977744306" target="_blank" rel="noopener">${EN ? 'Message us on WhatsApp' : 'Escríbenos por WhatsApp'}</a></p>`;

  const error = t => { const e = document.getElementById('err'); if(e){ e.hidden = !t; e.textContent = t || ''; } };

  async function tarjeta(){
    document.getElementById('op-tarjeta').classList.add('on');
    const box = document.getElementById('brick');
    if(brick) return;
    if(!D.publicKey || !window.MercadoPago){ error(EN ? 'Card payment is not available right now. Use your Mercado Pago account or message us on WhatsApp.' : 'El pago con tarjeta no está disponible en este momento. Usa tu cuenta Mercado Pago o escríbenos por WhatsApp.'); return; }
    box.innerHTML = '';
    const mp = new MercadoPago(D.publicKey, { locale: EN ? 'en-US' : 'es-CL' });
    brick = await mp.bricks().create('cardPayment', 'brick', {
      initialization: { amount: D.monto },
      customization: { paymentMethods: { maxInstallments: 1, minInstallments: 1 }, visual: { style: { theme: 'default', customVariables: { baseColor: '#4F7F86' } } } },
      callbacks: {
        onReady: () => {},
        onError: e => console.error(e),
        onSubmit: (f, extra) => new Promise(async (ok, mal) => {
          if(pagando) return mal();
          pagando = true; error('');
          try{
            const r = await fetch('/api/pagar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
              o: id, token: f.token, payment_method_id: f.payment_method_id, issuer_id: f.issuer_id,
              payment_type: (extra && extra.paymentTypeId) || f.payment_type_id || '', email: f.payer && f.payer.email, identification: f.payer && f.payer.identification
            }) }).then(x => x.json());
            if(r.ok){
              ok();
              pg.innerHTML = `<div class="pg-ok"><b>${EN ? 'Payment done!' : '¡Pago listo!'}</b><br>${EN ? 'Taking you back…' : 'Te llevamos de vuelta…'}</div>`;
              location.href = r.vuelta || '/';
              return;
            }
            mal(); error(EN ? 'The payment could not be completed. Please check your card details or try another card.' : (r.error || 'No se pudo hacer el pago.'));
            // El formulario se vuelve a armar para intentar de nuevo (cada intento usa datos nuevos de la tarjeta)
            try{ brick.unmount(); }catch(_){}
            brick = null; pagando = false; tarjeta();
          }catch(x){ mal(); pagando = false; error(EN ? 'We could not connect. Check your internet and try again.' : 'No pudimos conectar. Revisa tu internet e intenta de nuevo.'); }
        })
      }
    });
  }

  function pintar(){
    if(D.estado === 'processed'){
      pg.innerHTML = `<div class="pg-hero"><small>Storm</small><h1>${EN ? 'Payment done' : 'Pago listo'}</h1><p>${EN ? 'This payment has already been made.' : 'Este pago ya está hecho.'}</p></div><a class="pg-opt" href="${esc(D.vuelta || '/')}"><i>✓</i><span><b>${EN ? 'Back' : 'Volver'}</b></span></a>`;
      return;
    }
    if(D.estado !== 'created'){
      pg.innerHTML = `<div class="pg-hero"><small>Storm</small><h1>${EN ? 'Payment expired' : 'Pago vencido'}</h1><p>${EN ? 'This payment link is no longer valid. Go back and start again.' : 'Este link de pago ya no sirve. Vuelve atrás y empieza de nuevo.'}</p></div>${ayuda}`;
      return;
    }
    // Con Webpay (Transbank): "Tarjeta" paga con Webpay para todos (chilenas y extranjeras, sin RUT). Mercado Pago queda solo con la cuenta.
    if(D.webpay){
      pg.innerHTML = `<div class="pg-hero"><small>${esc(D.titulo)}</small><h1>${clp(D.monto)}</h1></div>
        <h2 class="pg-h2">${EN ? 'How would you like to pay?' : '¿Cómo quieres pagar?'}</h2>
        <button class="pg-opt" id="op-wp" type="button"><i>💳</i><span><b>${EN ? 'Card' : 'Tarjeta'}</b><small>${EN ? 'Credit, debit or prepaid, Chilean or foreign (Webpay)' : 'Crédito, débito o prepago, chilena o extranjera (Webpay)'}</small></span></button>
        <div class="pg-err" id="err" hidden></div>
        <a class="pg-opt" id="op-cuenta" href="${esc(D.cuenta)}"><i>👤</i><span><b>${EN ? 'With my Mercado Pago account' : 'Con mi cuenta Mercado Pago'}</b><small>${EN ? 'Use your Mercado Pago balance or saved cards' : 'Usa el saldo o las tarjetas guardadas en tu cuenta'}</small></span></a>
        <p class="pg-note">${EN ? 'Payments are processed securely by Transbank (Webpay) or Mercado Pago.' : 'Pago seguro con Webpay (Transbank) o Mercado Pago.'} ${EN ? 'Questions?' : '¿Dudas?'} <a href="https://wa.me/56977744306" target="_blank" rel="noopener">WhatsApp</a></p>`;
      const b = document.getElementById('op-wp');
      b.onclick = async () => {
        if(b.disabled) return; b.disabled = true; b.classList.add('on'); error('');
        b.querySelector('small').textContent = EN ? 'Taking you to Webpay…' : 'Te llevamos a Webpay…';
        if(!(await irExterno(''))){ b.disabled = false; b.classList.remove('on'); b.querySelector('small').textContent = EN ? 'Credit, debit or prepaid, Chilean or foreign (Webpay)' : 'Crédito, débito o prepago, chilena o extranjera (Webpay)'; }
      };
      avisosVuelta();
      return;
    }
    pg.innerHTML = `<div class="pg-hero"><small>${esc(D.titulo)}</small><h1>${clp(D.monto)}</h1></div>
      <h2 class="pg-h2">${EN ? 'How would you like to pay?' : '¿Cómo quieres pagar?'}</h2>
      <button class="pg-opt" id="op-tarjeta" type="button"><i>💳</i><span><b>${EN ? 'Card' : 'Tarjeta'}</b><small>${EN ? 'Credit, debit or prepaid, no Mercado Pago account needed' : 'Crédito, débito o prepago, sin cuenta Mercado Pago'}</small></span></button>
      <div id="brick"></div>
      <div class="pg-err" id="err" hidden></div>
 ${D.flow ? `<button class="pg-opt" id="op-flow" type="button"><i>🌎</i><span><b>${EN ? 'Foreign card (no RUT)' : 'Tarjeta extranjera'}</b><small>${EN ? 'Visa or Mastercard from outside Chile, with your passport' : 'Sin RUT chileno, con pasaporte (Visa o Mastercard)'}</small></span></button><div id="flowbox"></div>` : ''}
      <a class="pg-opt" id="op-cuenta" href="${esc(D.cuenta)}"><i>👤</i><span><b>${EN ? 'With my Mercado Pago account' : 'Con mi cuenta Mercado Pago'}</b><small>${EN ? 'Use your Mercado Pago balance or saved cards' : 'Usa el saldo o las tarjetas guardadas en tu cuenta'}</small></span></a>
      ${ayuda}`;
    document.getElementById('op-tarjeta').onclick = tarjeta;
    if(D.flow) document.getElementById('op-flow').onclick = conFlow;
    avisosVuelta();
  }

  // Mensaje al volver de Webpay o Flow sin pagar
  function avisosVuelta(){
    const fq = new URLSearchParams(location.search).get('flow');
    if(fq) error(fq === 'pendiente'
      ? (EN ? 'Your payment is still being processed. If it was charged, you will get an email; please do not pay again.' : 'Tu pago se está procesando. Si se cobró, te llegará un correo; no pagues de nuevo.')
      : (EN ? 'The card payment was not completed. You can try again or use another card.' : 'El pago no se completó. Puedes intentar de nuevo o usar otra tarjeta.'));
    const tk = new URLSearchParams(location.search).get('tk');
    if(tk) document.getElementById('err').insertAdjacentHTML('beforeend', '<br><small style="word-break:break-all">Token (prueba): ' + esc(tk) + '</small>');
  }

  // Tarjeta extranjera: se paga en Flow (Webpay), que no pide RUT
  function conFlow(){
    document.getElementById('op-flow').classList.add('on');
    const box = document.getElementById('flowbox');
    if(box.innerHTML) return;
    if(D.webpay){ box.innerHTML = `<div class="pg-fl"><button id="fl-ir" type="button">${EN ? 'Continue to pay' : 'Continuar al pago'} · ${clp(D.monto)}</button><p>${EN ? 'You will be taken to Webpay (Transbank), the secure Chilean payment page. Amount in Chilean pesos (CLP).' : 'Te llevamos a Webpay (Transbank), página de pago segura. Monto en pesos chilenos.'}</p></div>`; }
    else box.innerHTML = `<div class="pg-fl"><label for="fl-mail">${EN ? 'Your email (for the receipt)' : 'Tu correo (para el comprobante)'}</label>
      <input id="fl-mail" type="email" autocomplete="email" inputmode="email" placeholder="${EN ? 'name@email.com' : 'nombre@correo.com'}">
      <button id="fl-ir" type="button">${EN ? 'Continue to pay' : 'Continuar al pago'} · ${clp(D.monto)}</button>
      <p>${EN ? 'You will be taken to Flow (Webpay), a secure Chilean payment page. Amount in Chilean pesos (CLP).' : 'Te llevamos a Flow (Webpay), página de pago segura. Monto en pesos chilenos.'}</p></div>`;
    document.getElementById('fl-ir').onclick = async () => {
      const b = document.getElementById('fl-ir'), em = document.getElementById('fl-mail'), email = em ? em.value.trim() : '';
      if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ error(EN ? 'Please check your email.' : 'Revisa tu correo.'); return; }
      b.disabled = true; error('');
      if(!(await irExterno(email))) b.disabled = false;
    };
  }

  // Crea el cobro en Webpay o Flow y lleva a la persona a pagar. Devuelve false si no se pudo.
  async function irExterno(email){
    try{
      const r = await fetch('/api/pagar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ o: id, flow: 1, email }) }).then(x => x.json());
      if(r.ok && r.url && r.token_ws){ const f = document.createElement('form'); f.method = 'POST'; f.action = r.url; f.innerHTML = '<input type="hidden" name="token_ws">'; f.firstChild.value = r.token_ws; document.body.appendChild(f); f.submit(); return true; }
      if(r.ok && r.url){ location.href = r.url; return true; }
      error(r.error || (EN ? 'Could not start the payment.' : 'No se pudo iniciar el pago.'));
    }catch(_){ error(EN ? 'Connection problem. Please try again.' : 'No pudimos conectar. Intenta de nuevo.'); }
    return false;
  }

  // Comprobante de pago con Webpay (Transbank)
  const Q = new URLSearchParams(location.search);
  if(Q.get('comprobante')){
    const tipos = { VD: EN ? 'Debit' : 'Débito', VN: EN ? 'Credit' : 'Crédito', VC: EN ? 'Credit, installments' : 'Crédito en cuotas', SI: EN ? 'Credit, 3 interest-free installments' : 'Crédito, 3 cuotas sin interés', S2: EN ? 'Credit, 2 interest-free installments' : 'Crédito, 2 cuotas sin interés', NC: EN ? 'Credit, interest-free installments' : 'Crédito, cuotas sin interés', VP: EN ? 'Prepaid' : 'Prepago' };
    const t = Q.get('t') || '', n = Number(Q.get('n')) || 0, f = Q.get('f') ? new Date(Q.get('f')) : null;
    const filas = [
      [EN ? 'Merchant' : 'Comercio', 'Storm Surf Academy · app.stormsurf.cl'],
      [EN ? 'Order number' : 'Orden de compra', Q.get('oc')],
      [EN ? 'Amount' : 'Monto', clp(Q.get('m')) + ' CLP'],
      [EN ? 'Authorization code' : 'Código de autorización', Q.get('ac')],
      [EN ? 'Date' : 'Fecha', f && !isNaN(f) ? f.toLocaleString(EN ? 'en-US' : 'es-CL', { timeZone: 'America/Santiago', dateStyle: 'medium', timeStyle: 'short' }) : ''],
      [EN ? 'Payment type' : 'Tipo de pago', tipos[t] || t],
      [EN ? 'Installments' : 'Cuotas', t === 'VD' || t === 'VP' ? (EN ? 'None' : 'Sin cuotas') : String(n || 1)],
      [EN ? 'Card' : 'Tarjeta', '**** ' + (Q.get('d') || '')]
    ];
    if(Q.get('tk')) filas.push(['Token', Q.get('tk')]);
    pg.innerHTML = `<div class="pg-hero"><small>Webpay</small><h1>${EN ? 'Payment approved' : 'Pago aprobado'}</h1><p>${EN ? 'Save this receipt.' : 'Guarda este comprobante.'}</p></div>
      <div class="pg-fl" id="detalle">${filas.map(([a, b]) => `<p style="display:flex;justify-content:space-between;gap:12px;opacity:1;margin:6px 0"><span style="opacity:.6">${a}</span><b style="text-align:right;overflow-wrap:anywhere;min-width:0">${esc(b)}</b></p>`).join('')}</div>
      <a class="pg-opt" id="seguir" href="/"><i>✓</i><span><b>${EN ? 'Continue' : 'Continuar'}</b></span></a>
      <p class="pg-note">${EN ? 'Payment processed by Webpay (Transbank).' : 'Pago procesado por Webpay (Transbank).'} ${EN ? 'Questions?' : '¿Dudas?'} <a href="https://wa.me/56977744306" target="_blank" rel="noopener">WhatsApp</a></p>`;
    fetch('/api/pagar?o=' + encodeURIComponent(id)).then(r => r.json()).then(r => {
      if(r && r.vuelta) document.getElementById('seguir').href = r.vuelta;
      if(r && r.titulo) document.getElementById('detalle').insertAdjacentHTML('beforeend', `<p style="display:flex;justify-content:space-between;gap:12px;opacity:1;margin:6px 0"><span style="opacity:.6">${EN ? 'Description' : 'Descripción'}</span><b style="text-align:right">${esc(r.titulo)}</b></p>`);
    }).catch(() => {});
    return;
  }
  if(new URLSearchParams(location.search).get('listo')){ pg.innerHTML = `<div class="pg-ok"><b>¡Pago de prueba listo!</b><br>Llegó a Mercado Pago. Puedes devolverlo desde tu cuenta.</div>`; return; }
  fetch('/api/pagar?o=' + encodeURIComponent(id)).then(r => r.json()).then(r => {
    if(!r.ok){ pg.innerHTML = `<div class="pg-err">${esc(r.error)}</div>${ayuda}`; return; }
    D = r; pintar();
  }).catch(() => { pg.innerHTML = `<div class="pg-err">${EN ? 'We could not load the payment. Check your internet and reload.' : 'No pudimos cargar el pago. Revisa tu internet y recarga.'}</div>${ayuda}`; });
})();
</script>
</body>
</html>
